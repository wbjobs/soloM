[package]
name = "mqtt-broker"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "mqtt-broker"
path = "src/main.rs"

[[bin]]
name = "mqtt-cli"
path = "src/bin/mqtt-cli.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json"] }
clap = { version = "4", features = ["derive"] }
log = "0.4"
env_logger = "0.11"
axum = "0.7"
dashmap = "6"
redis = { version = "0.25", features = ["aio", "tokio-comp"] }
