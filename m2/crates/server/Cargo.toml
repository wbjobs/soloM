[package]
name = "server"
version = "0.1.0"
edition = "2021"

[dependencies]
common = { path = "../common" }
storage = { path = "../storage" }
query = { path = "../query" }
tokio = { version = "1.0", features = ["full"] }
tonic = "0.9"
prost = "0.12"
axum = "0.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"

[build-dependencies]
tonic-build = "0.9"
