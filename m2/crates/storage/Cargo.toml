[package]
name = "storage"
version = "0.1.0"
edition = "2021"

[dependencies]
common = { path = "../common" }
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
bytes = "1.0"
anyhow = "1.0"
thiserror = "1.0"
crossbeam-skiplist = "0.1"
parking_lot = "0.12"
crc32fast = "1.3"
arc-swap = "1.6"
crossbeam-channel = "0.5"
tracing = "0.1"
chrono = { version = "0.4", features = ["serde"] }
