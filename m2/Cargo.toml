[package]
name = "tsdb"
version = "0.1.0"
edition = "2021"
description = "Lightweight Time Series Database with LSM-Tree storage"

[workspace]
members = [
    "crates/storage",
    "crates/query",
    "crates/server",
    "crates/common",
]

[dependencies]
storage = { path = "crates/storage" }
query = { path = "crates/query" }
server = { path = "crates/server" }
common = { path = "crates/common" }

tokio = { version = "1.0", features = ["full"] }
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
clap = { version = "4.0", features = ["derive"] }
serde_json = "1.0"
