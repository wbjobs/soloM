<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>音频波形可视化工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1a1a2e;
            color: #eee;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #4fc3f7;
            font-size: 28px;
        }

        .upload-section {
            background: #16213e;
            padding: 30px;
            border-radius: 12px;
            margin-bottom: 20px;
            text-align: center;
        }

        .file-input-wrapper {
            position: relative;
            display: inline-block;
            margin-bottom: 15px;
        }

        .file-input-wrapper input[type="file"] {
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0;
            width: 100%;
            height: 100%;
            cursor: pointer;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .file-info {
            margin-top: 15px;
            color: #888;
            font-size: 14px;
        }

        .waveform-section {
            background: #16213e;
            padding: 20px;
            border-radius: 12px;
            display: none;
        }

        .waveform-section.active {
            display: block;
        }

        .info-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 1px solid #2a3a5c;
            flex-wrap: wrap;
            gap: 8px;
        }

        .info-item {
            color: #aaa;
            font-size: 14px;
        }

        .info-item span {
            color: #4fc3f7;
            font-weight: bold;
        }

        .canvas-wrapper {
            position: relative;
            width: 100%;
            overflow: hidden;
            border-radius: 8px;
            background: #0f0f23;
        }

        canvas {
            display: block;
            width: 100%;
            cursor: grab;
        }

        canvas.mode-select {
            cursor: crosshair;
        }

        canvas:active {
            cursor: grabbing;
        }

        canvas.mode-select:active {
            cursor: crosshair;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .control-btn {
            background: #2a3a5c;
            color: #eee;
            padding: 8px 18px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.2s;
        }

        .control-btn:hover {
            background: #3d5a80;
        }

        .control-btn.active {
            background: #667eea;
            color: #fff;
        }

        .control-btn.play-btn {
            background: linear-gradient(135deg, #00b894, #00cec9);
            color: #fff;
        }

        .control-btn.play-btn:hover {
            background: linear-gradient(135deg, #00cec9, #00b894);
        }

        .control-btn.play-btn:disabled {
            background: #2a3a5c;
            color: #666;
            cursor: not-allowed;
        }

        .control-btn.stop-btn {
            background: linear-gradient(135deg, #e17055, #d63031);
            color: #fff;
        }

        .control-btn.stop-btn:hover {
            background: linear-gradient(135deg, #d63031, #e17055);
        }

        .control-btn.stop-btn:disabled {
            background: #2a3a5c;
            color: #666;
            cursor: not-allowed;
        }

        .mode-group {
            display: flex;
            gap: 2px;
            background: #1a1a2e;
            border-radius: 6px;
            padding: 2px;
        }

        .mode-btn {
            background: #2a3a5c;
            color: #aaa;
            padding: 6px 14px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
        }

        .mode-btn.active {
            background: #667eea;
            color: #fff;
        }

        .mode-btn:hover:not(.active) {
            background: #3d5a80;
            color: #eee;
        }

        .selection-info {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 12px;
            flex-wrap: wrap;
        }

        .sel-item {
            color: #888;
            font-size: 13px;
        }

        .sel-item span {
            color: #ffd93d;
            font-weight: bold;
        }

        .zoom-info {
            text-align: center;
            margin-top: 10px;
            color: #666;
            font-size: 12px;
        }

        .hint {
            text-align: center;
            color: #666;
            font-size: 13px;
            margin-top: 10px;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 40px;
        }

        .loading.active {
            display: block;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #2a3a5c;
            border-top-color: #4fc3f7;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .error {
            background: #ff4444;
            color: white;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
            display: none;
        }

        .error.active {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎵 音频波形可视化工具</h1>

        <div class="upload-section">
            <div class="file-input-wrapper">
                <button class="btn">选择 MP3 文件</button>
                <input type="file" id="fileInput" accept=".mp3">
            </div>
            <div class="file-info" id="fileInfo">支持 MP3 格式，鼠标滚轮可缩放时间轴</div>
            <div class="error" id="error"></div>
        </div>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <div>正在处理音频...</div>
        </div>

        <div class="waveform-section" id="waveformSection">
            <div class="info-bar">
                <div class="info-item">文件名: <span id="fileName">-</span></div>
                <div class="info-item">时长: <span id="duration">-</span></div>
                <div class="info-item">采样率: <span id="sampleRate">-</span></div>
            </div>
            <div class="canvas-wrapper">
                <canvas id="waveformCanvas"></canvas>
            </div>
            <div class="controls">
                <div class="mode-group">
                    <button class="mode-btn active" id="modeBrowse" title="拖拽平移波形">🖱️ 浏览</button>
                    <button class="mode-btn" id="modeSelect" title="拖拽选取时间段">✂️ 选取</button>
                </div>
                <button class="control-btn" id="zoomIn">放大 +</button>
                <button class="control-btn" id="zoomOut">缩小 -</button>
                <button class="control-btn" id="resetZoom">重置</button>
                <button class="control-btn play-btn" id="playBtn" disabled>▶ 播放选区</button>
                <button class="control-btn stop-btn" id="stopBtn" disabled>⏹ 停止</button>
            </div>
            <div class="selection-info" id="selectionInfo" style="display:none">
                <div class="sel-item">选区起点: <span id="selStart">-</span></div>
                <div class="sel-item">选区终点: <span id="selEnd">-</span></div>
                <div class="sel-item">选区时长: <span id="selDuration">-</span></div>
            </div>
            <div class="zoom-info" id="zoomInfo">缩放级别: 1x</div>
            <div class="hint" id="hintText">💡 鼠标滚轮缩放 | 拖拽平移波形</div>
        </div>
    </div>

    <script>
        const fileInput = document.getElementById('fileInput');
        const fileInfo = document.getElementById('fileInfo');
        const loading = document.getElementById('loading');
        const error = document.getElementById('error');
        const waveformSection = document.getElementById('waveformSection');
        const canvas = document.getElementById('waveformCanvas');
        const ctx = canvas.getContext('2d');

        let waveformData = [];
        let hiResWaveformData = null;
        let hiResStart = 0;
        let hiResEnd = 0;
        let fileHash = null;
        let audioDuration = 0;
        let zoomLevel = 1;
        let offsetX = 0;
        let isDragging = false;
        let lastX = 0;
        let rafId = null;
        let fetchingHiRes = false;

        let offscreenCanvas = null;
        let offscreenCtx = null;
        let cachedZoomLevel = 0;
        let cachedOffsetX = -1;

        const HIGH_RES_THRESHOLD = 8;
        const HI_RES_PIXELS = 2000;

        let interactionMode = 'browse';
        let isSelecting = false;
        let selStartX = 0;
        let selEndX = 0;
        let selectionStartTime = null;
        let selectionEndTime = null;

        let audioContext = null;
        let audioBuffer = null;
        let audioDecoding = false;
        let currentSource = null;
        let isPlaying = false;
        let playStartTime = 0;
        let playOffset = 0;
        let playDuration = 0;
        let playAnimId = null;

        function initOffscreenCanvas(width, height) {
            if (!offscreenCanvas || offscreenCanvas.width !== width || offscreenCanvas.height !== height) {
                offscreenCanvas = document.createElement('canvas');
                offscreenCanvas.width = width;
                offscreenCanvas.height = height;
                offscreenCtx = offscreenCanvas.getContext('2d');
            }
        }

        function resizeCanvas() {
            const wrapper = canvas.parentElement;
            const cssWidth = wrapper.clientWidth;
            const cssHeight = 300;
            const dpr = window.devicePixelRatio;

            canvas.width = cssWidth * dpr;
            canvas.height = cssHeight * dpr;
            canvas.style.width = cssWidth + 'px';
            canvas.style.height = cssHeight + 'px';
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

            initOffscreenCanvas(canvas.width, canvas.height);

            cachedZoomLevel = 0;
            cachedOffsetX = -1;

            if (waveformData.length > 0) {
                scheduleDraw();
            }
        }

        function scheduleDraw() {
            if (rafId) return;
            rafId = requestAnimationFrame(() => {
                rafId = null;
                drawWaveform();
            });
        }

        function drawBackground(context, width, height, centerY) {
            context.fillStyle = '#0f0f23';
            context.fillRect(0, 0, width, height);

            context.strokeStyle = '#1a1a35';
            context.lineWidth = 1;
            context.beginPath();
            for (let i = 0; i < width; i += 50) {
                context.moveTo(i, 0);
                context.lineTo(i, height);
            }
            context.moveTo(0, centerY);
            context.lineTo(width, centerY);
            context.stroke();
        }

        function getAggregatedSamplesFast(data, startIdx, endIdx, pixels) {
            const samplesPerPixel = Math.max(1, Math.floor((endIdx - startIdx) / pixels));
            const result = new Float32Array(pixels * 2);

            for (let px = 0; px < pixels; px++) {
                const s = startIdx + Math.floor(px * samplesPerPixel);
                const e = Math.min(startIdx + Math.floor((px + 1) * samplesPerPixel), endIdx);

                let maxVal = -Infinity;
                let minVal = Infinity;

                for (let i = s; i < e; i++) {
                    const idx = i * 2;
                    const mx = data[idx];
                    const mn = data[idx + 1];
                    if (mx > maxVal) maxVal = mx;
                    if (mn < minVal) minVal = mn;
                }

                if (maxVal === -Infinity) {
                    maxVal = 0;
                    minVal = 0;
                }

                result[px * 2] = maxVal;
                result[px * 2 + 1] = minVal;
            }

            return result;
        }

        function getActiveWaveformData(startTime, endTime) {
            if (hiResWaveformData &&
                startTime >= hiResStart - 0.1 &&
                endTime <= hiResEnd + 0.1) {
                const totalHiResSamples = hiResWaveformData.length / 2;
                const hiResDuration = hiResEnd - hiResStart;
                const startSample = Math.floor(((startTime - hiResStart) / hiResDuration) * totalHiResSamples);
                const endSample = Math.ceil(((endTime - hiResStart) / hiResDuration) * totalHiResSamples);
                return {
                    data: hiResWaveformData,
                    startIdx: Math.max(0, startSample),
                    endIdx: Math.min(totalHiResSamples, endSample)
                };
            }

            const totalSamples = waveformData.length / 2;
            const startSample = Math.floor((startTime / audioDuration) * totalSamples);
            const endSample = Math.ceil((endTime / audioDuration) * totalSamples);
            return {
                data: waveformData,
                startIdx: Math.max(0, startSample),
                endIdx: Math.min(totalSamples, endSample)
            };
        }

        async function fetchHiResWaveform(startTime, endTime) {
            if (!fileHash || fetchingHiRes) return;
            fetchingHiRes = true;
            try {
                const padding = (endTime - startTime) * 0.5;
                const reqStart = Math.max(0, startTime - padding);
                const reqEnd = Math.min(audioDuration, endTime + padding);
                const response = await fetch(
                    `/waveform?file_hash=${fileHash}&start=${reqStart}&end=${reqEnd}&pixels=${HI_RES_PIXELS}`
                );
                if (!response.ok) throw new Error('Failed to fetch high-res data');
                const data = await response.json();
                hiResWaveformData = data.waveform;
                hiResStart = data.start_time;
                hiResEnd = data.end_time;
                cachedZoomLevel = 0;
                cachedOffsetX = -1;
                scheduleDraw();
            } catch (e) {
                console.warn('High-res fetch failed:', e);
            } finally {
                fetchingHiRes = false;
            }
        }

        function checkHiResNeeded() {
            if (zoomLevel >= HIGH_RES_THRESHOLD && fileHash && audioDuration > 0) {
                const startTime = offsetX * audioDuration;
                const endTime = startTime + audioDuration / zoomLevel;
                const needsFetch = !hiResWaveformData ||
                    startTime < hiResStart ||
                    endTime > hiResEnd ||
                    (hiResEnd - hiResStart) > (endTime - startTime) * 3;
                if (needsFetch && !fetchingHiRes) {
                    fetchHiResWaveform(startTime, endTime);
                }
            }
        }

        function timeToPixel(time) {
            const viewStartTime = offsetX * audioDuration;
            const viewEndTime = viewStartTime + audioDuration / zoomLevel;
            const width = canvas.width / window.devicePixelRatio;
            return ((time - viewStartTime) / (viewEndTime - viewStartTime)) * width;
        }

        function pixelToTime(px) {
            const viewStartTime = offsetX * audioDuration;
            const viewEndTime = viewStartTime + audioDuration / zoomLevel;
            const width = canvas.width / window.devicePixelRatio;
            return viewStartTime + (px / width) * (viewEndTime - viewStartTime);
        }

        function drawWaveform() {
            const dpr = window.devicePixelRatio;
            const width = canvas.width / dpr;
            const height = canvas.height / dpr;
            const centerY = height / 2;

            if (waveformData.length === 0) {
                drawBackground(ctx, width, height, centerY);
                return;
            }

            const needsRedraw = cachedZoomLevel !== zoomLevel ||
                               Math.abs(cachedOffsetX - offsetX) >= 0.001;

            if (needsRedraw) {
                checkHiResNeeded();

                const startTime = offsetX * audioDuration;
                const endTime = startTime + audioDuration / zoomLevel;
                const { data, startIdx, endIdx } = getActiveWaveformData(startTime, endTime);

                drawBackground(offscreenCtx, width, height, centerY);

                const pixels = Math.ceil(width);
                const aggregated = getAggregatedSamplesFast(data, startIdx, endIdx, pixels);

                const gradient = offscreenCtx.createLinearGradient(0, 0, 0, height);
                gradient.addColorStop(0, 'rgba(79, 195, 247, 0.9)');
                gradient.addColorStop(0.5, 'rgba(102, 126, 234, 0.9)');
                gradient.addColorStop(1, 'rgba(118, 75, 162, 0.9)');

                offscreenCtx.beginPath();
                offscreenCtx.strokeStyle = gradient;
                offscreenCtx.lineWidth = 1.5;

                const centerY9 = centerY * 0.9;
                for (let px = 0; px < pixels; px++) {
                    const idx = px * 2;
                    const maxVal = aggregated[idx] || 0;
                    const minVal = aggregated[idx + 1] || 0;
                    const y1 = centerY - (maxVal * centerY9);
                    const y2 = centerY - (minVal * centerY9);
                    offscreenCtx.moveTo(px, y1);
                    offscreenCtx.lineTo(px, y2);
                }
                offscreenCtx.stroke();

                offscreenCtx.fillStyle = 'rgba(79, 195, 247, 0.1)';
                offscreenCtx.beginPath();
                for (let px = 0; px < pixels; px++) {
                    const idx = px * 2;
                    const maxVal = aggregated[idx] || 0;
                    const y = centerY - (maxVal * centerY9);
                    if (px === 0) offscreenCtx.moveTo(px, y);
                    else offscreenCtx.lineTo(px, y);
                }
                for (let px = pixels - 1; px >= 0; px--) {
                    const idx = px * 2;
                    const minVal = aggregated[idx + 1] || 0;
                    const y = centerY - (minVal * centerY9);
                    offscreenCtx.lineTo(px, y);
                }
                offscreenCtx.closePath();
                offscreenCtx.fill();

                cachedZoomLevel = zoomLevel;
                cachedOffsetX = offsetX;
            }

            ctx.drawImage(offscreenCanvas, 0, 0, width, height, 0, 0, width, height);

            drawSelectionOverlay(width, height);
            drawPlaybackCursor(width, height);
        }

        function drawSelectionOverlay(width, height) {
            if (selectionStartTime === null || selectionEndTime === null) return;

            const x1 = timeToPixel(selectionStartTime);
            const x2 = timeToPixel(selectionEndTime);
            const left = Math.min(x1, x2);
            const right = Math.max(x1, x2);

            if (right < 0 || left > width) return;

            const clampedLeft = Math.max(0, left);
            const clampedRight = Math.min(width, right);

            ctx.fillStyle = 'rgba(255, 217, 61, 0.15)';
            ctx.fillRect(clampedLeft, 0, clampedRight - clampedLeft, height);

            ctx.strokeStyle = 'rgba(255, 217, 61, 0.8)';
            ctx.lineWidth = 2;
            ctx.setLineDash([6, 3]);

            if (left >= 0 && left <= width) {
                ctx.beginPath();
                ctx.moveTo(left, 0);
                ctx.lineTo(left, height);
                ctx.stroke();
            }
            if (right >= 0 && right <= width) {
                ctx.beginPath();
                ctx.moveTo(right, 0);
                ctx.lineTo(right, height);
                ctx.stroke();
            }

            ctx.setLineDash([]);
        }

        function drawPlaybackCursor(width, height) {
            if (!isPlaying || selectionStartTime === null) return;

            const elapsed = audioContext.currentTime - playStartTime;
            const currentTime = playOffset + elapsed;
            const selectionEnd = Math.max(selectionStartTime, selectionEndTime);
            const selectionStart = Math.min(selectionStartTime, selectionEndTime);

            if (currentTime > selectionEnd) {
                stopPlayback();
                return;
            }

            const x = timeToPixel(currentTime);
            if (x >= 0 && x <= width) {
                ctx.strokeStyle = '#ff6b6b';
                ctx.lineWidth = 2;
                ctx.setLineDash([]);
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, height);
                ctx.stroke();

                ctx.fillStyle = '#ff6b6b';
                ctx.beginPath();
                ctx.moveTo(x - 5, 0);
                ctx.lineTo(x + 5, 0);
                ctx.lineTo(x, 8);
                ctx.closePath();
                ctx.fill();
            }

            playAnimId = requestAnimationFrame(() => scheduleDraw());
        }

        function updateZoomInfo() {
            document.getElementById('zoomInfo').textContent = `缩放级别: ${zoomLevel.toFixed(1)}x`;
        }

        function updateSelectionInfo() {
            const infoEl = document.getElementById('selectionInfo');
            const playBtn = document.getElementById('playBtn');

            if (selectionStartTime !== null && selectionEndTime !== null) {
                const s = Math.min(selectionStartTime, selectionEndTime);
                const e = Math.max(selectionStartTime, selectionEndTime);
                const dur = e - s;

                document.getElementById('selStart').textContent = formatTime(s);
                document.getElementById('selEnd').textContent = formatTime(e);
                document.getElementById('selDuration').textContent = formatTime(dur);
                infoEl.style.display = 'flex';
                playBtn.disabled = false;
            } else {
                infoEl.style.display = 'none';
                playBtn.disabled = true;
            }
        }

        function formatTime(seconds) {
            const m = Math.floor(seconds / 60);
            const s = (seconds % 60).toFixed(2);
            return `${m}:${s.padStart(5, '0')}`;
        }

        function zoom(factor, centerX = 0.5) {
            const oldZoom = zoomLevel;
            zoomLevel = Math.max(1, Math.min(50, zoomLevel * factor));

            if (zoomLevel !== oldZoom) {
                const centerOffset = offsetX + centerX / oldZoom;
                offsetX = centerOffset - centerX / zoomLevel;
                offsetX = Math.max(0, Math.min(1 - 1 / zoomLevel, offsetX));

                scheduleDraw();
                updateZoomInfo();
            }
        }

        function setMode(mode) {
            interactionMode = mode;
            document.getElementById('modeBrowse').classList.toggle('active', mode === 'browse');
            document.getElementById('modeSelect').classList.toggle('active', mode === 'select');
            canvas.classList.toggle('mode-select', mode === 'select');

            const hint = document.getElementById('hintText');
            if (mode === 'browse') {
                hint.textContent = '💡 鼠标滚轮缩放 | 拖拽平移波形';
            } else {
                hint.textContent = '💡 在波形上拖拽选取时间段 | 点击播放按钮播放选区';
            }
        }

        async function decodeAudio() {
            if (audioBuffer) return audioBuffer;
            if (audioDecoding) return null;

            audioDecoding = true;
            try {
                if (!audioContext) {
                    audioContext = new (window.AudioContext || window.webkitAudioContext)();
                }
                const response = await fetch(`/audio/${fileHash}`);
                const arrayBuffer = await response.arrayBuffer();
                audioBuffer = await audioContext.decodeAudioData(arrayBuffer);
                return audioBuffer;
            } catch (e) {
                console.error('Audio decode failed:', e);
                return null;
            } finally {
                audioDecoding = false;
            }
        }

        async function playSelection() {
            if (selectionStartTime === null || selectionEndTime === null) return;

            stopPlayback();

            const buf = await decodeAudio();
            if (!buf) return;

            const startSec = Math.min(selectionStartTime, selectionEndTime);
            const endSec = Math.max(selectionStartTime, selectionEndTime);
            const duration = endSec - startSec;

            if (duration <= 0) return;

            if (audioContext.state === 'suspended') {
                await audioContext.resume();
            }

            currentSource = audioContext.createBufferSource();
            currentSource.buffer = buf;
            currentSource.connect(audioContext.destination);

            currentSource.onended = () => {
                if (isPlaying) {
                    stopPlayback();
                }
            };

            playOffset = startSec;
            playDuration = duration;
            playStartTime = audioContext.currentTime;
            isPlaying = true;

            currentSource.start(0, startSec, duration);

            document.getElementById('stopBtn').disabled = false;
            document.getElementById('playBtn').textContent = '⏸ 暂停';

            playAnimId = requestAnimationFrame(() => scheduleDraw());
        }

        function stopPlayback() {
            if (currentSource) {
                try { currentSource.stop(); } catch (e) {}
                currentSource.disconnect();
                currentSource = null;
            }

            isPlaying = false;
            if (playAnimId) {
                cancelAnimationFrame(playAnimId);
                playAnimId = null;
            }

            document.getElementById('stopBtn').disabled = true;
            document.getElementById('playBtn').textContent = '▶ 播放选区';

            cachedZoomLevel = 0;
            scheduleDraw();
        }

        document.getElementById('modeBrowse').addEventListener('click', () => setMode('browse'));
        document.getElementById('modeSelect').addEventListener('click', () => setMode('select'));

        document.getElementById('playBtn').addEventListener('click', () => {
            if (isPlaying) {
                stopPlayback();
            } else {
                playSelection();
            }
        });

        document.getElementById('stopBtn').addEventListener('click', () => {
            stopPlayback();
        });

        fileInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            fileInfo.textContent = `已选择: ${file.name}`;
            error.classList.remove('active');
            loading.classList.add('active');
            waveformSection.classList.remove('active');

            stopPlayback();

            const formData = new FormData();
            formData.append('file', file);

            try {
                const response = await fetch('/upload', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || '上传失败');
                }

                waveformData = data.waveform;
                hiResWaveformData = null;
                hiResStart = 0;
                hiResEnd = 0;
                fileHash = data.file_hash;
                audioDuration = data.duration;
                audioBuffer = null;
                zoomLevel = 1;
                offsetX = 0;
                selectionStartTime = null;
                selectionEndTime = null;
                cachedZoomLevel = 0;
                cachedOffsetX = -1;

                document.getElementById('fileName').textContent = data.filename;
                document.getElementById('duration').textContent = data.duration.toFixed(2) + ' 秒';
                document.getElementById('sampleRate').textContent = data.sample_rate + ' Hz';

                updateSelectionInfo();

                loading.classList.remove('active');
                waveformSection.classList.add('active');
                resizeCanvas();
                updateZoomInfo();

            } catch (err) {
                loading.classList.remove('active');
                error.textContent = '错误: ' + err.message;
                error.classList.add('active');
            }
        });

        document.getElementById('zoomIn').addEventListener('click', () => zoom(1.5));
        document.getElementById('zoomOut').addEventListener('click', () => zoom(0.67));
        document.getElementById('resetZoom').addEventListener('click', () => {
            zoomLevel = 1;
            offsetX = 0;
            hiResWaveformData = null;
            hiResStart = 0;
            hiResEnd = 0;
            cachedZoomLevel = 0;
            cachedOffsetX = -1;
            scheduleDraw();
            updateZoomInfo();
        });

        let wheelTimeout = null;
        canvas.addEventListener('wheel', (e) => {
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            const mouseX = (e.clientX - rect.left) / rect.width;
            const factor = e.deltaY < 0 ? 1.2 : 0.83;

            if (wheelTimeout) clearTimeout(wheelTimeout);
            wheelTimeout = setTimeout(() => {
                cachedZoomLevel = 0;
                cachedOffsetX = -1;
                scheduleDraw();
            }, 150);

            zoom(factor, mouseX);
        }, { passive: false });

        canvas.addEventListener('mousedown', (e) => {
            const rect = canvas.getBoundingClientRect();
            const px = e.clientX - rect.left;

            if (interactionMode === 'select') {
                isSelecting = true;
                selStartX = px;
                selEndX = px;
                selectionStartTime = pixelToTime(px);
                selectionEndTime = pixelToTime(px);
                updateSelectionInfo();
                scheduleDraw();
            } else {
                isDragging = true;
                lastX = e.clientX;
            }
        });

        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            const px = e.clientX - rect.left;

            if (isSelecting) {
                selEndX = px;
                selectionEndTime = pixelToTime(px);
                updateSelectionInfo();
                scheduleDraw();
                return;
            }

            if (!isDragging) return;
            const deltaX = lastX - e.clientX;
            const width = canvas.width / window.devicePixelRatio;
            const panAmount = (deltaX / width) * (1 / zoomLevel);
            offsetX = Math.max(0, Math.min(1 - 1 / zoomLevel, offsetX + panAmount));
            lastX = e.clientX;

            cachedZoomLevel = 0;
            scheduleDraw();
        });

        let dragEndTimeout = null;
        canvas.addEventListener('mouseup', (e) => {
            if (isSelecting) {
                isSelecting = false;
                const rect = canvas.getBoundingClientRect();
                selEndX = e.clientX - rect.left;
                selectionEndTime = pixelToTime(selEndX);

                if (Math.abs(selEndX - selStartX) < 3) {
                    selectionStartTime = null;
                    selectionEndTime = null;
                }

                updateSelectionInfo();
                scheduleDraw();
                return;
            }

            if (isDragging) {
                isDragging = false;

                if (dragEndTimeout) clearTimeout(dragEndTimeout);
                dragEndTimeout = setTimeout(() => {
                    cachedZoomLevel = 0;
                    cachedOffsetX = -1;
                    scheduleDraw();
                }, 100);
            }
        });

        canvas.addEventListener('mouseleave', () => {
            if (isSelecting) {
                isSelecting = false;
                updateSelectionInfo();
                scheduleDraw();
            }
            if (isDragging) {
                isDragging = false;
                cachedZoomLevel = 0;
                cachedOffsetX = -1;
                scheduleDraw();
            }
        });

        let resizeTimeout = null;
        window.addEventListener('resize', () => {
            if (resizeTimeout) clearTimeout(resizeTimeout);
            resizeTimeout = setTimeout(resizeCanvas, 150);
        });

        resizeCanvas();
    </script>
</body>
</html>
