<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D 机房预览</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            background: #1a1a2e;
        }

        #container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        #canvas-container {
            width: 100%;
            height: 100%;
        }

        #header {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            padding: 16px 24px;
            background: linear-gradient(to bottom, rgba(0, 0, 0, 0.7), transparent);
            color: white;
            z-index: 100;
        }

        #header h1 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        #header .subtitle {
            font-size: 14px;
            color: #aaa;
        }

        #legend {
            position: absolute;
            top: 80px;
            right: 20px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            border-radius: 8px;
            padding: 16px;
            color: white;
            z-index: 100;
            min-width: 160px;
        }

        #legend h3 {
            font-size: 14px;
            margin-bottom: 12px;
            color: #ccc;
        }

        .legend-item {
            display: flex;
            align-items: center;
            margin-bottom: 8px;
            font-size: 13px;
        }

        .legend-color {
            width: 16px;
            height: 16px;
            border-radius: 4px;
            margin-right: 10px;
        }

        .legend-normal {
            background: #00ff88;
            box-shadow: 0 0 10px #00ff88;
        }

        .legend-alarm {
            background: #ff3366;
            box-shadow: 0 0 10px #ff3366;
        }

        .legend-rack {
            background: #444455;
        }

        .temperature-legend {
            display: none;
        }

        .temperature-gradient {
            width: 100%;
            height: 20px;
            border-radius: 4px;
            background: linear-gradient(to right, #0066ff, #00ccff, #00ff99, #ffff00, #ff9900, #ff3300);
            margin: 8px 0;
        }

        .temperature-labels {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: #aaa;
        }

        #mode-toggle {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 100;
        }

        .toggle-btn {
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .toggle-btn:hover {
            background: rgba(0, 255, 136, 0.2);
            border-color: #00ff88;
        }

        .toggle-btn.heatmap-active {
            background: rgba(255, 51, 102, 0.2);
            border-color: #ff3366;
        }

        .toggle-btn .icon {
            font-size: 16px;
        }

        #stats {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            border-radius: 8px;
            padding: 16px;
            color: white;
            z-index: 100;
            min-width: 200px;
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 13px;
        }

        .stat-row:last-child {
            margin-bottom: 0;
        }

        .stat-value {
            font-weight: 600;
        }

        .stat-value.normal {
            color: #00ff88;
        }

        .stat-value.alarm {
            color: #ff3366;
        }

        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 18px;
            z-index: 200;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top: 3px solid #00ff88;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        #controls {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            border-radius: 8px;
            padding: 12px 16px;
            color: #aaa;
            z-index: 100;
            font-size: 12px;
        }

        #controls div {
            margin-bottom: 4px;
        }

        #controls div:last-child {
            margin-bottom: 0;
        }

        #server-tooltip {
            position: absolute;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 10px 14px;
            color: white;
            font-size: 12px;
            pointer-events: none;
            z-index: 300;
            display: none;
            min-width: 150px;
        }

        #server-tooltip .tooltip-name {
            font-weight: 600;
            margin-bottom: 4px;
            font-size: 13px;
        }

        #server-tooltip .tooltip-status {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 11px;
        }

        #server-tooltip .tooltip-status.normal {
            background: rgba(0, 255, 136, 0.2);
            color: #00ff88;
        }

        #server-tooltip .tooltip-status.alarm {
            background: rgba(255, 51, 102, 0.2);
            color: #ff3366;
        }

        #server-detail-modal {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(20, 20, 35, 0.95);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 24px;
            color: white;
            z-index: 400;
            display: none;
            min-width: 320px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        #server-detail-modal .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 20px;
        }

        #server-detail-modal .modal-title {
            font-size: 18px;
            font-weight: 600;
        }

        #server-detail-modal .modal-close {
            background: none;
            border: none;
            color: #888;
            font-size: 24px;
            cursor: pointer;
            line-height: 1;
            transition: color 0.2s;
        }

        #server-detail-modal .modal-close:hover {
            color: white;
        }

        #server-detail-modal .detail-row {
            display: flex;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        #server-detail-modal .detail-row:last-child {
            border-bottom: none;
        }

        #server-detail-modal .detail-label {
            color: #888;
            width: 100px;
            font-size: 13px;
        }

        #server-detail-modal .detail-value {
            flex: 1;
            font-size: 13px;
        }

        #server-detail-modal .detail-value .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 4px;
            font-weight: 600;
        }

        #server-detail-modal .detail-value .status-badge.normal {
            background: rgba(0, 255, 136, 0.15);
            color: #00ff88;
        }

        #server-detail-modal .detail-value .status-badge.alarm {
            background: rgba(255, 51, 102, 0.15);
            color: #ff3366;
        }

        #server-detail-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 399;
            display: none;
        }

        .label-container {
            position: relative;
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 6px;
            padding: 8px 12px;
            color: white;
            font-size: 12px;
            white-space: nowrap;
            pointer-events: auto;
            cursor: pointer;
            transition: all 0.2s;
        }

        .label-container:hover {
            background: rgba(0, 255, 136, 0.2);
            border-color: #00ff88;
        }

        .label-container .label-name {
            font-weight: 600;
        }

        .label-container .label-status {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-left: 6px;
        }

        .label-container .label-status.normal {
            background: #00ff88;
            box-shadow: 0 0 6px #00ff88;
        }

        .label-container .label-status.alarm {
            background: #ff3366;
            box-shadow: 0 0 6px #ff3366;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }
    </style>
</head>
<body>
    <div id="container">
        <div id="canvas-container"></div>
        
        <div id="header">
            <h1>3D 机房预览</h1>
            <div class="subtitle" id="room-name">数据中心 A 区</div>
        </div>

        <div id="legend">
            <h3 id="legend-title">图例</h3>
            <div id="status-legend">
                <div class="legend-item">
                    <div class="legend-color legend-normal"></div>
                    <span>运行正常</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color legend-alarm"></div>
                    <span>告警状态</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color legend-rack"></div>
                    <span>机柜框架</span>
                </div>
            </div>
            <div id="temperature-legend" class="temperature-legend">
                <div class="legend-item" style="margin-bottom: 8px;">
                    <span style="font-size: 13px;">温度分布</span>
                </div>
                <div class="temperature-gradient"></div>
                <div class="temperature-labels">
                    <span>20°C</span>
                    <span>25°C</span>
                    <span>30°C</span>
                    <span>35°C</span>
                    <span>40°C</span>
                </div>
            </div>
        </div>

        <div id="mode-toggle">
            <button class="toggle-btn" id="heatmap-toggle">
                <span class="icon">🌡️</span>
                <span id="toggle-text">热力图</span>
            </button>
        </div>

        <div id="stats">
            <div class="stat-row">
                <span>机柜总数</span>
                <span class="stat-value" id="rack-count">0</span>
            </div>
            <div class="stat-row">
                <span>服务器总数</span>
                <span class="stat-value" id="server-count">0</span>
            </div>
            <div class="stat-row">
                <span>正常运行</span>
                <span class="stat-value normal" id="normal-count">0</span>
            </div>
            <div class="stat-row">
                <span>告警数量</span>
                <span class="stat-value alarm" id="alarm-count">0</span>
            </div>
        </div>

        <div id="controls">
            <div>🖱️ 左键拖动：旋转视角</div>
            <div>🖱️ 滚轮：缩放</div>
            <div>🖱️ 右键拖动：平移</div>
            <div>🖱️ 点击服务器：查看详情</div>
        </div>

        <div id="server-tooltip"></div>

        <div id="server-detail-overlay"></div>
        <div id="server-detail-modal">
            <div class="modal-header">
                <div class="modal-title" id="modal-title">服务器详情</div>
                <button class="modal-close" id="modal-close">&times;</button>
            </div>
            <div class="detail-row">
                <div class="detail-label">服务器ID</div>
                <div class="detail-value" id="detail-id">-</div>
            </div>
            <div class="detail-row">
                <div class="detail-label">服务器名称</div>
                <div class="detail-value" id="detail-name">-</div>
            </div>
            <div class="detail-row">
                <div class="detail-label">所属机柜</div>
                <div class="detail-value" id="detail-rack">-</div>
            </div>
            <div class="detail-row">
                <div class="detail-label">U位位置</div>
                <div class="detail-value" id="detail-uposition">-</div>
            </div>
            <div class="detail-row">
                <div class="detail-label">运行状态</div>
                <div class="detail-value" id="detail-status">-</div>
            </div>
            <div class="detail-row">
                <div class="detail-label">CPU 使用率</div>
                <div class="detail-value" id="detail-cpu">-</div>
            </div>
            <div class="detail-row">
                <div class="detail-label">内存使用率</div>
                <div class="detail-value" id="detail-memory">-</div>
            </div>
            <div class="detail-row">
                <div class="detail-label">温度</div>
                <div class="detail-value" id="detail-temp">-</div>
            </div>
        </div>

        <div id="loading">
            <div class="spinner"></div>
            <div>加载中...</div>
        </div>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

        let scene, camera, renderer, controls, labelRenderer;
        let serverRoomData = null;
        let temperatureData = null;
        let raycaster, mouse;
        let serverMeshes = [];
        let serverLabels = [];
        let hoveredServer = null;
        let selectedServer = null;
        let originalMaterials = new Map();
        let isHeatmapMode = false;
        let temperatureMap = new Map();

        const RACK_WIDTH = 1.8;
        const RACK_DEPTH = 1.0;
        const RACK_HEIGHT = 4.5;
        const SERVER_HEIGHT = 0.4;
        const SERVER_WIDTH = 1.6;
        const SERVER_DEPTH = 0.8;
        const SERVER_GAP = 0.02;

        const COLOR_NORMAL = 0x00ff88;
        const COLOR_ALARM = 0xff3366;
        const COLOR_RACK = 0x444455;
        const COLOR_FLOOR = 0x2a2a3e;
        const COLOR_FLOOR_GRID = 0x3a3a4e;
        const COLOR_HIGHLIGHT = 0xffff00;

        const MIN_TEMP = 20;
        const MAX_TEMP = 40;

        async function init() {
            await fetchData();
            await fetchTemperatureData();
            setupScene();
            setupRaycaster();
            createFloor();
            createRacks();
            updateStats();
            setupEventListeners();
            animate();
            document.getElementById('loading').style.display = 'none';
        }

        async function fetchData() {
            try {
                const response = await fetch('/api/server-room');
                serverRoomData = await response.json();
                document.getElementById('room-name').textContent = serverRoomData.room.name;
            } catch (error) {
                console.error('获取数据失败:', error);
                serverRoomData = getFallbackData();
            }
        }

        async function fetchTemperatureData() {
            try {
                const response = await fetch('/api/temperature-field');
                temperatureData = await response.json();
                buildTemperatureMap();
            } catch (error) {
                console.error('获取温度数据失败:', error);
            }
        }

        function buildTemperatureMap() {
            if (!temperatureData) return;
            temperatureData.racks.forEach(rack => {
                rack.temperaturePoints.forEach(point => {
                    temperatureMap.set(point.id, point.temperature);
                });
            });
        }

        function temperatureToColor(temperature) {
            const t = Math.max(MIN_TEMP, Math.min(MAX_TEMP, temperature));
            const ratio = (t - MIN_TEMP) / (MAX_TEMP - MIN_TEMP);
            
            let r, g, b;
            
            if (ratio <= 0.2) {
                const localRatio = ratio / 0.2;
                r = 0;
                g = Math.floor(153 + 102 * localRatio);
                b = 255;
            } else if (ratio <= 0.4) {
                const localRatio = (ratio - 0.2) / 0.2;
                r = 0;
                g = Math.floor(204 + 51 * localRatio);
                b = Math.floor(255 - 255 * localRatio);
            } else if (ratio <= 0.6) {
                const localRatio = (ratio - 0.4) / 0.2;
                r = Math.floor(255 * localRatio);
                g = 255;
                b = 0;
            } else if (ratio <= 0.8) {
                const localRatio = (ratio - 0.6) / 0.2;
                r = 255;
                g = Math.floor(255 - 102 * localRatio);
                b = 0;
            } else {
                const localRatio = (ratio - 0.8) / 0.2;
                r = 255;
                g = Math.floor(153 - 153 * localRatio);
                b = 0;
            }
            
            return new THREE.Color(r / 255, g / 255, b / 255);
        }

        function getFallbackData() {
            return {
                room: { name: '数据中心 A 区', width: 20, depth: 10 },
                racks: [
                    {
                        id: 'RACK-001', name: '机柜 1', position: { x: -6, z: 0 },
                        servers: [
                            { id: 'SRV-001', name: '服务器 1', status: 'normal', uPosition: 1 },
                            { id: 'SRV-002', name: '服务器 2', status: 'alarm', uPosition: 2 }
                        ]
                    }
                ]
            };
        }

        function setupScene() {
            const container = document.getElementById('canvas-container');
            
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1a1a2e);
            scene.fog = new THREE.Fog(0x1a1a2e, 15, 50);

            camera = new THREE.PerspectiveCamera(
                60,
                window.innerWidth / window.innerHeight,
                0.1,
                1000
            );
            camera.position.set(0, 8, 12);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            container.appendChild(renderer.domElement);

            labelRenderer = new CSS2DRenderer();
            labelRenderer.setSize(window.innerWidth, window.innerHeight);
            labelRenderer.domElement.style.position = 'absolute';
            labelRenderer.domElement.style.top = '0px';
            labelRenderer.domElement.style.left = '0px';
            labelRenderer.domElement.style.pointerEvents = 'none';
            container.appendChild(labelRenderer.domElement);

            controls = new OrbitControls(camera, labelRenderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.minDistance = 5;
            controls.maxDistance = 30;
            controls.maxPolarAngle = Math.PI / 2.1;
            controls.target.set(0, 2, 0);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
            scene.add(ambientLight);

            const mainLight = new THREE.DirectionalLight(0xffffff, 0.8);
            mainLight.position.set(10, 20, 10);
            mainLight.castShadow = true;
            mainLight.shadow.mapSize.width = 2048;
            mainLight.shadow.mapSize.height = 2048;
            mainLight.shadow.camera.near = 0.5;
            mainLight.shadow.camera.far = 50;
            mainLight.shadow.camera.left = -15;
            mainLight.shadow.camera.right = 15;
            mainLight.shadow.camera.top = 15;
            mainLight.shadow.camera.bottom = -15;
            scene.add(mainLight);

            const fillLight = new THREE.DirectionalLight(0x6699ff, 0.3);
            fillLight.position.set(-10, 10, -10);
            scene.add(fillLight);

            const pointLight1 = new THREE.PointLight(0x00ff88, 0.5, 10);
            pointLight1.position.set(-6, 3, 0);
            scene.add(pointLight1);

            const pointLight2 = new THREE.PointLight(0xff3366, 0.3, 10);
            pointLight2.position.set(6, 3, 0);
            scene.add(pointLight2);

            window.addEventListener('resize', onWindowResize);
        }

        function setupRaycaster() {
            raycaster = new THREE.Raycaster();
            raycaster.far = 50;
            mouse = new THREE.Vector2();
        }

        function setupEventListeners() {
            const canvas = labelRenderer.domElement;
            
            canvas.addEventListener('mousemove', onMouseMove);
            canvas.addEventListener('click', onMouseClick);
            
            document.getElementById('modal-close').addEventListener('click', closeModal);
            document.getElementById('server-detail-overlay').addEventListener('click', closeModal);
            document.getElementById('heatmap-toggle').addEventListener('click', toggleHeatmapMode);
        }

        function toggleHeatmapMode() {
            isHeatmapMode = !isHeatmapMode;
            const toggleBtn = document.getElementById('heatmap-toggle');
            const toggleText = document.getElementById('toggle-text');
            const statusLegend = document.getElementById('status-legend');
            const tempLegend = document.getElementById('temperature-legend');
            const legendTitle = document.getElementById('legend-title');

            if (isHeatmapMode) {
                toggleBtn.classList.add('heatmap-active');
                toggleText.textContent = '正常模式';
                statusLegend.style.display = 'none';
                tempLegend.style.display = 'block';
                legendTitle.textContent = '热力图';
                applyHeatmapColors();
            } else {
                toggleBtn.classList.remove('heatmap-active');
                toggleText.textContent = '热力图';
                statusLegend.style.display = 'block';
                tempLegend.style.display = 'none';
                legendTitle.textContent = '图例';
                restoreOriginalColors();
            }
            
            updateAllServerLabels();
        }

        function applyHeatmapColors() {
            serverMeshes.forEach(mesh => {
                const serverInfo = mesh.userData.serverInfo;
                const temperature = temperatureMap.get(serverInfo.id) || 25;
                const heatColor = temperatureToColor(temperature);
                
                if (!originalMaterials.has(mesh)) {
                    originalMaterials.set(mesh, {
                        color: mesh.material.color.clone(),
                        emissive: mesh.material.emissive.clone(),
                        emissiveIntensity: mesh.material.emissiveIntensity
                    });
                }
                
                mesh.material.color.copy(heatColor);
                mesh.material.emissive.copy(heatColor);
                mesh.material.emissiveIntensity = 0.15;
                
                serverInfo.temperature = temperature;
            });
        }

        function restoreOriginalColors() {
            serverMeshes.forEach(mesh => {
                const original = originalMaterials.get(mesh);
                if (original) {
                    mesh.material.color.copy(original.color);
                    mesh.material.emissive.copy(original.emissive);
                    mesh.material.emissiveIntensity = mesh.userData.isAlarm ? 0.3 : 0.1;
                }
            });
        }

        function onMouseMove(event) {
            const rect = labelRenderer.domElement.getBoundingClientRect();
            mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
            mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

            const intersects = performRaycast();

            if (hoveredServer && (!intersects.length || intersects[0].object !== hoveredServer)) {
                unhighlightServer(hoveredServer);
                hoveredServer = null;
                hideTooltip();
            }

            if (intersects.length > 0) {
                const intersected = intersects[0].object;
                if (intersected !== hoveredServer) {
                    if (hoveredServer) {
                        unhighlightServer(hoveredServer);
                    }
                    hoveredServer = intersected;
                    highlightServer(hoveredServer);
                    showTooltip(event, hoveredServer.userData.serverInfo);
                } else {
                    updateTooltipPosition(event);
                }
            }

            labelRenderer.domElement.style.cursor = intersects.length > 0 ? 'pointer' : 'grab';
        }

        function onMouseClick(event) {
            if (event.button !== 0) return;
            
            const intersects = performRaycast();
            
            if (intersects.length > 0) {
                const intersected = intersects[0].object;
                selectedServer = intersected;
                showServerDetail(intersected.userData.serverInfo);
            }
        }

        function performRaycast() {
            raycaster.setFromCamera(mouse, camera);
            
            const allIntersects = raycaster.intersectObjects(serverMeshes, false);
            
            if (allIntersects.length === 0) return [];

            const validIntersects = allIntersects.filter(intersect => {
                const mesh = intersect.object;
                const worldPos = new THREE.Vector3();
                mesh.getWorldPosition(worldPos);
                
                const cameraDir = new THREE.Vector3();
                camera.getWorldDirection(cameraDir);
                
                const toServer = new THREE.Vector3().subVectors(worldPos, camera.position);
                const dot = toServer.dot(cameraDir);
                
                return dot > 0;
            });

            if (validIntersects.length === 0) return [];

            validIntersects.sort((a, b) => {
                const aFaceNormal = a.face.normal.clone();
                aFaceNormal.transformDirection(a.object.matrixWorld);
                const aDot = aFaceNormal.dot(raycaster.ray.direction);
                
                const bFaceNormal = b.face.normal.clone();
                bFaceNormal.transformDirection(b.object.matrixWorld);
                const bDot = bFaceNormal.dot(raycaster.ray.direction);

                if (aDot < -0.3 && bDot >= -0.3) return -1;
                if (bDot < -0.3 && aDot >= -0.3) return 1;
                
                return a.distance - b.distance;
            });

            return validIntersects;
        }

        function highlightServer(mesh) {
            if (!originalMaterials.has(mesh)) {
                originalMaterials.set(mesh, {
                    color: mesh.material.color.clone(),
                    emissive: mesh.material.emissive.clone(),
                    emissiveIntensity: mesh.material.emissiveIntensity
                });
            }
            
            mesh.material.emissive.setHex(COLOR_HIGHLIGHT);
            mesh.material.emissiveIntensity = 0.4;
        }

        function unhighlightServer(mesh) {
            if (mesh === selectedServer) return;
            
            const original = originalMaterials.get(mesh);
            if (original) {
                mesh.material.emissive.copy(original.emissive);
                mesh.material.emissiveIntensity = mesh.userData.isAlarm ? 0.3 : 0.1;
            }
        }

        function showTooltip(event, serverInfo) {
            const tooltip = document.getElementById('server-tooltip');
            const temperature = temperatureMap.get(serverInfo.id);
            
            let content = `<div class="tooltip-name">${serverInfo.name}</div>`;
            
            if (isHeatmapMode && temperature) {
                content += `<div style="font-size: 16px; font-weight: 600; margin: 4px 0;">${temperature}°C</div>`;
            } else {
                const statusClass = serverInfo.status === 'alarm' ? 'alarm' : 'normal';
                const statusText = serverInfo.status === 'alarm' ? '告警' : '正常';
                content += `<div><span class="tooltip-status ${statusClass}">${statusText}</span></div>`;
            }
            
            content += `<div style="margin-top: 4px; color: #888; font-size: 11px;">点击查看详情</div>`;
            
            tooltip.innerHTML = content;
            tooltip.style.display = 'block';
            updateTooltipPosition(event);
        }

        function updateTooltipPosition(event) {
            const tooltip = document.getElementById('server-tooltip');
            const x = event.clientX + 15;
            const y = event.clientY + 15;
            
            tooltip.style.left = x + 'px';
            tooltip.style.top = y + 'px';
        }

        function hideTooltip() {
            document.getElementById('server-tooltip').style.display = 'none';
        }

        function showServerDetail(serverInfo) {
            const modal = document.getElementById('server-detail-modal');
            const overlay = document.getElementById('server-detail-overlay');
            
            document.getElementById('modal-title').textContent = serverInfo.name;
            document.getElementById('detail-id').textContent = serverInfo.id;
            document.getElementById('detail-name').textContent = serverInfo.name;
            document.getElementById('detail-rack').textContent = serverInfo.rackName;
            document.getElementById('detail-uposition').textContent = `U${serverInfo.uPosition}`;
            
            const statusClass = serverInfo.status === 'alarm' ? 'alarm' : 'normal';
            const statusText = serverInfo.status === 'alarm' ? '告警' : '运行正常';
            document.getElementById('detail-status').innerHTML = `<span class="status-badge ${statusClass}">${statusText}</span>`;
            
            const cpu = Math.floor(Math.random() * 60) + 20;
            const memory = Math.floor(Math.random() * 50) + 30;
            const temp = temperatureMap.get(serverInfo.id) || (Math.floor(Math.random() * 15) + 35);
            
            document.getElementById('detail-cpu').textContent = `${cpu}%`;
            document.getElementById('detail-memory').textContent = `${memory}%`;
            document.getElementById('detail-temp').textContent = `${temp}°C`;
            
            modal.style.display = 'block';
            overlay.style.display = 'block';
        }

        function closeModal() {
            document.getElementById('server-detail-modal').style.display = 'none';
            document.getElementById('server-detail-overlay').style.display = 'none';
            
            if (selectedServer) {
                unhighlightServer(selectedServer);
                selectedServer = null;
            }
        }

        function createFloor() {
            const floorGeometry = new THREE.PlaneGeometry(
                serverRoomData.room.width,
                serverRoomData.room.depth
            );
            const floorMaterial = new THREE.MeshStandardMaterial({
                color: COLOR_FLOOR,
                roughness: 0.8,
                metalness: 0.2
            });
            const floor = new THREE.Mesh(floorGeometry, floorMaterial);
            floor.rotation.x = -Math.PI / 2;
            floor.receiveShadow = true;
            scene.add(floor);

            const gridHelper = new THREE.GridHelper(
                serverRoomData.room.width,
                serverRoomData.room.width,
                COLOR_FLOOR_GRID,
                COLOR_FLOOR_GRID
            );
            gridHelper.position.y = 0.01;
            scene.add(gridHelper);

            const edgeGeometry = new THREE.EdgesGeometry(
                new THREE.BoxGeometry(
                    serverRoomData.room.width,
                    0.1,
                    serverRoomData.room.depth
                )
            );
            const edgeMaterial = new THREE.LineBasicMaterial({ color: 0x444466 });
            const edges = new THREE.LineSegments(edgeGeometry, edgeMaterial);
            edges.position.y = 0.05;
            scene.add(edges);
        }

        function createRacks() {
            serverRoomData.racks.forEach(rack => {
                const rackGroup = new THREE.Group();
                rackGroup.position.set(rack.position.x, 0, rack.position.z);

                createRackFrame(rackGroup);
                createRackLabel(rackGroup, rack.name);
                
                rack.servers.forEach(server => {
                    server.rackName = rack.name;
                    server.rackId = rack.id;
                    createServer(rackGroup, server);
                });

                scene.add(rackGroup);
            });
        }

        function createRackFrame(group) {
            const frameMaterial = new THREE.MeshStandardMaterial({
                color: COLOR_RACK,
                roughness: 0.6,
                metalness: 0.4,
                transparent: true,
                opacity: 0.9
            });

            const leftPost = new THREE.Mesh(
                new THREE.BoxGeometry(0.1, RACK_HEIGHT, 0.1),
                frameMaterial
            );
            leftPost.position.set(-RACK_WIDTH / 2 + 0.05, RACK_HEIGHT / 2, 0);
            leftPost.castShadow = true;
            group.add(leftPost);

            const rightPost = new THREE.Mesh(
                new THREE.BoxGeometry(0.1, RACK_HEIGHT, 0.1),
                frameMaterial
            );
            rightPost.position.set(RACK_WIDTH / 2 - 0.05, RACK_HEIGHT / 2, 0);
            rightPost.castShadow = true;
            group.add(rightPost);

            const topBeam = new THREE.Mesh(
                new THREE.BoxGeometry(RACK_WIDTH, 0.1, 0.1),
                frameMaterial
            );
            topBeam.position.set(0, RACK_HEIGHT - 0.05, 0);
            topBeam.castShadow = true;
            group.add(topBeam);

            const bottomBeam = new THREE.Mesh(
                new THREE.BoxGeometry(RACK_WIDTH, 0.1, 0.1),
                frameMaterial
            );
            bottomBeam.position.set(0, 0.05, 0);
            bottomBeam.castShadow = true;
            group.add(bottomBeam);

            const backPanel = new THREE.Mesh(
                new THREE.BoxGeometry(RACK_WIDTH - 0.2, RACK_HEIGHT - 0.2, 0.05),
                new THREE.MeshStandardMaterial({
                    color: 0x333344,
                    roughness: 0.9,
                    metalness: 0.1
                })
            );
            backPanel.position.set(0, RACK_HEIGHT / 2, -RACK_DEPTH / 2 + 0.05);
            backPanel.castShadow = true;
            group.add(backPanel);

            const base = new THREE.Mesh(
                new THREE.BoxGeometry(RACK_WIDTH, 0.15, RACK_DEPTH),
                new THREE.MeshStandardMaterial({
                    color: 0x222233,
                    roughness: 0.7,
                    metalness: 0.3
                })
            );
            base.position.set(0, 0.075, 0);
            base.castShadow = true;
            base.receiveShadow = true;
            group.add(base);
        }

        function createRackLabel(group, name) {
            const canvas = document.createElement('canvas');
            canvas.width = 256;
            canvas.height = 64;
            const ctx = canvas.getContext('2d');
            
            ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
            ctx.fillRect(0, 0, 256, 64);
            
            ctx.font = 'bold 28px Arial';
            ctx.fillStyle = '#ffffff';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(name, 128, 32);

            const texture = new THREE.CanvasTexture(canvas);
            const material = new THREE.SpriteMaterial({ 
                map: texture,
                transparent: true
            });
            const sprite = new THREE.Sprite(material);
            sprite.scale.set(1.5, 0.375, 1);
            sprite.position.set(0, RACK_HEIGHT + 0.3, 0);
            group.add(sprite);
        }

        function createServer(group, server) {
            const color = server.status === 'alarm' ? COLOR_ALARM : COLOR_NORMAL;
            
            const serverGroup = new THREE.Group();
            
            const geometry = new THREE.BoxGeometry(
                SERVER_WIDTH,
                SERVER_HEIGHT - SERVER_GAP,
                SERVER_DEPTH
            );
            
            const material = new THREE.MeshStandardMaterial({
                color: color,
                roughness: 0.3,
                metalness: 0.7,
                emissive: color,
                emissiveIntensity: server.status === 'alarm' ? 0.3 : 0.1,
                side: THREE.DoubleSide
            });
            
            const mesh = new THREE.Mesh(geometry, material);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            
            mesh.userData.serverInfo = server;
            mesh.userData.isServer = true;
            
            if (server.status === 'alarm') {
                mesh.userData.isAlarm = true;
                mesh.userData.baseEmissive = 0.3;
            }

            const ledGeometry = new THREE.BoxGeometry(0.08, 0.08, 0.02);
            const ledMaterial = new THREE.MeshBasicMaterial({
                color: color,
                transparent: true,
                opacity: 0.9
            });
            const led = new THREE.Mesh(ledGeometry, ledMaterial);
            led.position.set(
                -SERVER_WIDTH / 2 + 0.15,
                0,
                SERVER_DEPTH / 2 + 0.01
            );
            mesh.add(led);

            const led2 = led.clone();
            led2.position.x = -SERVER_WIDTH / 2 + 0.3;
            mesh.add(led2);

            serverGroup.add(mesh);
            serverMeshes.push(mesh);

            const yPos = 0.15 + (server.uPosition - 1) * SERVER_HEIGHT + SERVER_HEIGHT / 2;
            serverGroup.position.set(0, yPos, 0);

            group.add(serverGroup);

            createServerLabel(serverGroup, server);
        }

        function createServerLabel(group, server) {
            const div = document.createElement('div');
            div.className = 'label-container';
            
            updateServerLabelContent(div, server, false);

            const label = new CSS2DObject(div);
            label.position.set(0, 0, SERVER_DEPTH / 2 + 0.1);
            label.center.set(0, 0.5);
            label.userData.serverInfo = server;
            label.userData.element = div;
            
            group.add(label);
            serverLabels.push(label);
        }

        function updateServerLabelContent(div, server, heatmapMode) {
            if (heatmapMode) {
                const temperature = temperatureMap.get(server.id) || '--';
                const tempColor = temperature >= 35 ? '#ff3366' : (temperature >= 28 ? '#ffaa00' : '#00ff88');
                div.innerHTML = `
                    <span class="label-name">${server.name}</span>
                    <span style="color: ${tempColor}; font-weight: 600; margin-left: 8px;">${temperature}°C</span>
                `;
            } else {
                const statusClass = server.status === 'alarm' ? 'alarm' : 'normal';
                div.innerHTML = `
                    <span class="label-name">${server.name}</span>
                    <span class="label-status ${statusClass}"></span>
                `;
            }
        }

        function updateAllServerLabels() {
            serverLabels.forEach(label => {
                updateServerLabelContent(label.userData.element, label.userData.serverInfo, isHeatmapMode);
            });
        }

        function updateStats() {
            let totalServers = 0;
            let normalCount = 0;
            let alarmCount = 0;

            serverRoomData.racks.forEach(rack => {
                rack.servers.forEach(server => {
                    totalServers++;
                    if (server.status === 'alarm') {
                        alarmCount++;
                    } else {
                        normalCount++;
                    }
                });
            });

            document.getElementById('rack-count').textContent = serverRoomData.racks.length;
            document.getElementById('server-count').textContent = totalServers;
            document.getElementById('normal-count').textContent = normalCount;
            document.getElementById('alarm-count').textContent = alarmCount;
        }

        function animate() {
            requestAnimationFrame(animate);

            if (!isHeatmapMode) {
                const time = Date.now() * 0.003;
                scene.traverse((object) => {
                    if (object.isMesh && object.userData.isAlarm && object !== hoveredServer && object !== selectedServer) {
                        const pulse = 0.2 + Math.sin(time) * 0.15;
                        object.material.emissiveIntensity = pulse;
                    }
                });
            }

            controls.update();
            renderer.render(scene, camera);
            labelRenderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            labelRenderer.setSize(window.innerWidth, window.innerHeight);
        }

        init();
    </script>
</body>
