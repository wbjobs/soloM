[package]
name = "tsdb-gateway"
version = "1.0.0"
edition = "2021"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
axum = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
bytes = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures = "0.3"

[dev-dependencies]
tokio-test = "0.4"

[lib]
name = "tsdb_gateway"
path = "src/lib.rs"

[[bin]]
name = "tsdb-gateway"
path = "src/main.rs"
