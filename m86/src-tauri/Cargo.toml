[package]
name = "encrypted-notes"
version = "0.1.0"
description = "A cross-platform encrypted notes application"
authors = ["you"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
keyring = "2.0"
rusqlite = { version = "0.31", features = ["bundled", "chrono", "serde_json"] }
aes-gcm = "0.10"
base64 = "0.21"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
thiserror = "1.0"
hex = "0.4"
rand = "0.8"
dirs = "5.0"
tokio = { version = "1.0", features = ["full"] }
libp2p = { version = "0.53", features = ["tokio", "gossipsub", "mdns", "noise", "tcp", "yamux", "macros", "ed25519", "quic"] }
futures = "0.3"
tracing = "0.1"
tracing-subscriber = "0.3"

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "4.0", default-features = false, features = ["tokio"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
