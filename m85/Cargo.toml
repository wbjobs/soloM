[package]
name = "dungeon-generator"
version = "1.0.0"
edition = "2021"
description = "ECS-based procedural dungeon generator with TCP streaming"

[dependencies]
legion = "0.4"
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
tokio = { version = "1.0", features = ["full"] }
futures = "0.3"
bytes = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
clap = { version = "4.0", features = ["derive"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
