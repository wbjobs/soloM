<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>票据 OCR 识别工作台</title>
<style>
:root {
  --bg: #0f1117;
  --surface: #1a1d27;
  --surface2: #242835;
  --border: #2e3348;
  --text: #e4e6f0;
  --text2: #8b8fa3;
  --accent: #6c8cff;
  --accent2: #4a6bff;
  --success: #34d399;
  --warn: #fbbf24;
  --danger: #f87171;
  --radius: 10px;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 24px; background: var(--surface);
  border-bottom: 1px solid var(--border); flex-shrink: 0;
}
header h1 { font-size: 18px; font-weight: 600; display: flex; align-items: center; gap: 10px; }
header h1 .icon { font-size: 22px; }
.header-actions { display: flex; gap: 10px; }

.btn {
  padding: 8px 18px; border-radius: 8px; border: none; cursor: pointer;
  font-size: 13px; font-weight: 500; transition: all .2s;
  display: inline-flex; align-items: center; gap: 6px;
}
.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:hover { background: var(--accent2); }
.btn-success { background: var(--success); color: #0f1117; }
.btn-warn { background: var(--warn); color: #0f1117; }
.btn-danger { background: var(--danger); color: #fff; }
.btn-ghost { background: transparent; color: var(--text2); border: 1px solid var(--border); }
.btn-ghost:hover { border-color: var(--accent); color: var(--text); }
.btn:disabled { opacity: .4; cursor: not-allowed; }

.main { display: flex; flex: 1; overflow: hidden; }

.panel-left {
  flex: 1; display: flex; flex-direction: column;
  border-right: 1px solid var(--border); position: relative;
}
.panel-right {
  width: 420px; display: flex; flex-direction: column;
  background: var(--surface); flex-shrink: 0;
}

.panel-title {
  padding: 12px 18px; font-size: 13px; font-weight: 600;
  color: var(--text2); text-transform: uppercase; letter-spacing: 1px;
  border-bottom: 1px solid var(--border); flex-shrink: 0;
  display: flex; align-items: center; justify-content: space-between;
}

.canvas-wrap {
  flex: 1; position: relative; overflow: auto;
  display: flex; align-items: center; justify-content: center;
  background: #0a0b10;
}
canvas { display: block; }

.empty-state {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  height: 100%; color: var(--text2); gap: 12px; padding: 40px;
}
.empty-state .big-icon { font-size: 48px; opacity: .4; }
.empty-state p { font-size: 14px; text-align: center; line-height: 1.6; }

.result-list { flex: 1; overflow-y: auto; padding: 12px; }
.result-card {
  background: var(--surface2); border-radius: var(--radius);
  margin-bottom: 10px; overflow: hidden; border: 1px solid var(--border);
  cursor: pointer; transition: border-color .2s;
}
.result-card:hover, .result-card.active { border-color: var(--accent); }
.result-card.active { box-shadow: 0 0 0 1px var(--accent); }

.result-card-header {
  padding: 10px 14px; display: flex; align-items: center; justify-content: space-between;
  border-bottom: 1px solid var(--border);
}
.result-card-header .id { font-weight: 600; font-size: 13px; }
.result-card-header .date { font-size: 11px; color: var(--text2); }

.badge {
  font-size: 10px; padding: 2px 8px; border-radius: 99px; font-weight: 600;
}
.badge-corrected { background: rgba(52,211,153,.15); color: var(--success); }
.badge-original { background: rgba(139,143,163,.15); color: var(--text2); }

.kv-list { padding: 10px 14px; }
.kv-row {
  display: flex; align-items: flex-start; gap: 8px; padding: 6px 0;
  border-bottom: 1px solid rgba(46,51,72,.5);
}
.kv-row:last-child { border-bottom: none; }
.kv-key {
  flex-shrink: 0; width: 80px; font-size: 12px; color: var(--text2);
  font-weight: 500; padding-top: 2px;
}
.kv-value-input {
  flex: 1; background: transparent; border: 1px solid transparent;
  color: var(--text); font-size: 13px; padding: 4px 8px; border-radius: 6px;
  font-family: inherit; outline: none; transition: all .2s;
}
.kv-value-input:hover { border-color: var(--border); }
.kv-value-input:focus { border-color: var(--accent); background: var(--bg); }

.finetune-panel {
  border-top: 1px solid var(--border); flex-shrink: 0;
}
.finetune-log {
  max-height: 160px; overflow-y: auto; padding: 10px 14px;
  font-family: 'Consolas', 'Monaco', monospace; font-size: 11px;
  line-height: 1.7; color: var(--text2); background: var(--bg);
}
.finetune-log .log-line { white-space: pre-wrap; }
.log-ok { color: var(--success); }
.log-running { color: var(--warn); }

.toolbar {
  padding: 8px 14px; display: flex; gap: 8px; align-items: center;
  border-bottom: 1px solid var(--border); flex-shrink: 0;
}
.toolbar label { font-size: 12px; color: var(--text2); display: flex; align-items: center; gap: 6px; }
.toolbar input[type=checkbox] { accent-color: var(--accent); }

.upload-area {
  border: 2px dashed var(--border); border-radius: var(--radius);
  padding: 40px; text-align: center; cursor: pointer; transition: border-color .2s;
  margin: 12px;
}
.upload-area:hover { border-color: var(--accent); }
.upload-area p { color: var(--text2); font-size: 13px; }
.upload-area .upload-icon { font-size: 32px; margin-bottom: 8px; opacity: .5; }

input[type=file] { display: none; }

.notification {
  position: fixed; top: 20px; right: 20px; z-index: 9999;
  padding: 12px 20px; border-radius: 8px; font-size: 13px;
  animation: slideIn .3s ease; box-shadow: 0 4px 20px rgba(0,0,0,.3);
}
.notification.success { background: var(--success); color: #0f1117; }
.notification.error { background: var(--danger); color: #fff; }
.notification.info { background: var(--accent); color: #fff; }
@keyframes slideIn { from { transform: translateX(100%); opacity:0; } to { transform: translateX(0); opacity:1; } }

::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--text2); }
</style>
</head>
<body>

<header>
  <h1><span class="icon">📄</span> 票据 OCR 识别工作台</h1>
  <div class="header-actions">
    <label class="btn btn-primary" id="uploadBtn">
      📤 上传票据
      <input type="file" id="fileInput" accept="image/*">
    </label>
    <button class="btn btn-success" id="saveBtn" disabled>💾 保存修正</button>
    <button class="btn btn-warn" id="finetuneBtn" disabled>🚀 触发微调</button>
  </div>
</header>

<div class="main">
  <div class="panel-left">
    <div class="toolbar">
      <label><input type="checkbox" id="showBoxes" checked> 显示文本框</label>
      <label><input type="checkbox" id="showText" checked> 显示文字</label>
      <span style="flex:1"></span>
      <span style="font-size:11px;color:var(--text2)" id="imageInfo"></span>
    </div>
    <div class="canvas-wrap" id="canvasWrap">
      <div class="empty-state" id="emptyState">
        <div class="big-icon">🖼️</div>
        <p>上传票据图片开始识别<br>支持 JPG / PNG / BMP 格式</p>
      </div>
      <canvas id="mainCanvas" style="display:none"></canvas>
    </div>
  </div>

  <div class="panel-right">
    <div class="panel-title">
      <span>识别结果</span>
      <span id="resultCount" style="font-size:11px;color:var(--text2)"></span>
    </div>
    <div class="result-list" id="resultList">
      <div class="empty-state">
        <div class="big-icon">📋</div>
        <p>暂无识别结果<br>上传图片后自动识别</p>
      </div>
    </div>
    <div class="finetune-panel">
      <div class="panel-title">
        <span>微调任务</span>
        <span id="finetuneStatus" style="font-size:11px;color:var(--text2)"></span>
      </div>
      <div class="finetune-log" id="finetuneLog">
        <div class="log-line" style="color:var(--text2)">等待触发微调任务...</div>
      </div>
    </div>
  </div>
</div>

<script>
const API = '/api/v1/ocr';
let currentResult = null;
let allResults = [];
let imageObj = null;
let editBoxes = [];
let dragState = null;
let selectedBoxIdx = -1;

const $ = id => document.getElementById(id);
const canvas = $('mainCanvas');
const ctx = canvas.getContext('2d');

function notify(msg, type='info') {
  const el = document.createElement('div');
  el.className = 'notification ' + type;
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 3000);
}

async function api(method, path, body=null) {
  const opts = { method, headers: {} };
  if (body instanceof FormData) {
    opts.body = body;
  } else if (body) {
    opts.headers['Content-Type'] = 'application/json';
    opts.body = JSON.stringify(body);
  }
  const res = await fetch(API + path, opts);
  if (!res.ok) {
    const err = await res.json().catch(() => ({detail: res.statusText}));
    throw new Error(err.detail || res.statusText);
  }
  return res.json();
}

$('fileInput').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const fd = new FormData();
  fd.append('file', file);
  try {
    notify('正在识别...', 'info');
    const result = await api('POST', '/upload', fd);
    notify('识别完成！', 'success');
    allResults.unshift(result);
    renderResultList();
    selectResult(result);
  } catch (err) {
    notify('识别失败: ' + err.message, 'error');
  }
  e.target.value = '';
});

async function loadResults() {
  try {
    const data = await api('GET', '/results?limit=50');
    allResults = data.items || [];
    renderResultList();
  } catch(e) { console.error(e); }
}

function renderResultList() {
  const list = $('resultList');
  $('resultCount').textContent = allResults.length + ' 条';
  if (!allResults.length) {
    list.innerHTML = '<div class="empty-state"><div class="big-icon">📋</div><p>暂无识别结果</p></div>';
    return;
  }
  list.innerHTML = allResults.map((r, i) => {
    const badge = r.corrected
      ? '<span class="badge badge-corrected">已修正</span>'
      : '<span class="badge badge-original">原始</span>';
    const kvEntries = Object.entries(r.kv_data || {}).slice(0, 4).map(([k,v]) =>
      `<div class="kv-row"><span class="kv-key">${esc(k)}</span><span style="font-size:13px">${esc(v)}</span></div>`
    ).join('');
    return `<div class="result-card${currentResult && currentResult.id === r.id ? ' active' : ''}" data-idx="${i}" onclick="selectResult(allResults[${i}])">
      <div class="result-card-header">
        <span class="id">#${r.id}</span>
        <span>${badge}</span>
        <span class="date">${r.created_at ? new Date(r.created_at).toLocaleString('zh-CN', {month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}) : ''}</span>
      </div>
      <div class="kv-list">${kvEntries}</div>
    </div>`;
  }).join('');
}

function esc(s) { const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }

async function selectResult(result) {
  currentResult = result;
  editBoxes = JSON.parse(JSON.stringify(result.boxes || []));
  $('saveBtn').disabled = false;
  $('finetuneBtn').disabled = false;
  renderResultList();
  await loadImage(result.image_url);
  renderKVEditor();
}

function loadImage(url) {
  return new Promise((resolve) => {
    imageObj = new Image();
    imageObj.crossOrigin = 'anonymous';
    imageObj.onload = () => {
      $('emptyState').style.display = 'none';
      canvas.style.display = 'block';
      drawCanvas();
      $('imageInfo').textContent = `${imageObj.naturalWidth} x ${imageObj.naturalHeight}`;
      resolve();
    };
    imageObj.onerror = () => { notify('图片加载失败', 'error'); resolve(); };
    imageObj.src = url;
  });
}

function drawCanvas() {
  if (!imageObj) return;
  const wrap = $('canvasWrap');
  const maxW = wrap.clientWidth - 40;
  const maxH = wrap.clientHeight - 40;
  const scale = Math.min(maxW / imageObj.naturalWidth, maxH / imageObj.naturalHeight, 1);
  const w = Math.round(imageObj.naturalWidth * scale);
  const h = Math.round(imageObj.naturalHeight * scale);

  canvas.width = w;
  canvas.height = h;
  ctx.clearRect(0, 0, w, h);
  ctx.drawImage(imageObj, 0, 0, w, h);

  if ($('showBoxes').checked) {
    editBoxes.forEach((box, idx) => {
      const pts = box.box.map(p => [p[0] * scale, p[1] * scale]);
      ctx.beginPath();
      ctx.moveTo(pts[0][0], pts[0][1]);
      for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
      ctx.closePath();

      const isSelected = idx === selectedBoxIdx;
      ctx.strokeStyle = isSelected ? '#ff6b6b' : 'rgba(108,140,255,.85)';
      ctx.lineWidth = isSelected ? 2.5 : 1.5;
      ctx.stroke();

      if (isSelected) {
        ctx.fillStyle = 'rgba(255,107,107,.1)';
        ctx.fill();
      }

      if ($('showText').checked && box.text) {
        const cx = pts.reduce((s,p) => s+p[0], 0) / pts.length;
        const cy = pts.reduce((s,p) => s+p[1], 0) / pts.length;
        ctx.font = `${Math.max(11, Math.round(12 * scale))}px system-ui`;
        ctx.fillStyle = isSelected ? '#ff6b6b' : 'rgba(108,140,255,.9)';
        ctx.textAlign = 'center';
        ctx.fillText(box.text, cx, pts[0][1] - 4);
      }
    });
  }

  canvas._scale = scale;
}

function renderKVEditor() {
  if (!currentResult) return;
  const list = $('resultList');
  const kv = currentResult.kv_data || {};
  const entries = Object.entries(kv);

  const card = list.querySelector('.result-card.active');
  if (!card) return;

  let kvHTML = '';
  entries.forEach(([k, v]) => {
    kvHTML += `<div class="kv-row">
      <span class="kv-key">${esc(k)}</span>
      <input class="kv-value-input" data-key="${esc(k)}" value="${esc(v)}" onchange="onKVChange(this)">
    </div>`;
  });
  kvHTML += `<div class="kv-row" style="border:none;padding-top:8px">
    <button class="btn btn-ghost" style="font-size:11px;padding:4px 10px" onclick="addKVField()">+ 添加字段</button>
  </div>`;

  const kvListEl = card.querySelector('.kv-list');
  if (kvListEl) kvListEl.innerHTML = kvHTML;
}

function onKVChange(input) {
  const key = input.dataset.key;
  currentResult.kv_data[key] = input.value;
  const boxIdx = editBoxes.findIndex(b => b.text && b.text.includes(key));
  if (boxIdx >= 0) {
    editBoxes[boxIdx].text = input.value;
    drawCanvas();
  }
}

function addKVField() {
  const key = prompt('输入字段名:');
  if (!key) return;
  const val = prompt('输入字段值:') || '';
  currentResult.kv_data[key] = val;
  renderKVEditor();
}

$('showBoxes').addEventListener('change', drawCanvas);
$('showText').addEventListener('change', drawCanvas);

canvas.addEventListener('mousedown', (e) => {
  if (!editBoxes.length || !canvas._scale) return;
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;
  const scale = canvas._scale;

  for (let i = editBoxes.length - 1; i >= 0; i--) {
    const pts = editBoxes[i].box.map(p => [p[0]*scale, p[1]*scale]);
    if (pointInPolygon(mx, my, pts)) {
      selectedBoxIdx = i;
      drawCanvas();
      return;
    }
  }
  selectedBoxIdx = -1;
  drawCanvas();
});

canvas.addEventListener('dblclick', (e) => {
  if (selectedBoxIdx < 0) return;
  const box = editBoxes[selectedBoxIdx];
  const newText = prompt('修正文本:', box.text);
  if (newText !== null) {
    box.text = newText;
    drawCanvas();
  }
});

function pointInPolygon(x, y, pts) {
  let inside = false;
  for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
    const [xi, yi] = pts[i], [xj, yj] = pts[j];
    if (((yi > y) !== (yj > y)) && (x < (xj-xi)*(y-yi)/(yj-yi)+xi))
      inside = !inside;
  }
  return inside;
}

$('saveBtn').addEventListener('click', async () => {
  if (!currentResult) return;
  try {
    const kv_data = currentResult.kv_data;
    const boxes = editBoxes.map(b => ({ text: b.text, box: b.box }));
    const updated = await api('PUT', `/results/${currentResult.id}`, { kv_data, boxes });
    currentResult = updated;
    const idx = allResults.findIndex(r => r.id === updated.id);
    if (idx >= 0) allResults[idx] = updated;
    renderResultList();
    renderKVEditor();
    notify('修正已保存！', 'success');
  } catch (err) {
    notify('保存失败: ' + err.message, 'error');
  }
});

$('finetuneBtn').addEventListener('click', async () => {
  try {
    const task = await api('POST', '/finetune');
    notify('微调任务已触发 #' + task.id, 'info');
    pollFinetune(task.id);
  } catch (err) {
    notify('触发失败: ' + err.message, 'error');
  }
});

async function pollFinetune(taskId) {
  const logEl = $('finetuneLog');
  let done = false;
  while (!done) {
    try {
      const task = await api('GET', `/finetune/${taskId}`);
      const lines = (task.log || '').split('\n').filter(l => l.trim());
      logEl.innerHTML = lines.map(l => {
        let cls = 'log-line';
        if (l.includes('完成') || l.includes('通过')) cls += ' log-ok';
        else if (l.includes('Epoch') || l.includes('加载') || l.includes('增强')) cls += ' log-running';
        return `<div class="${cls}">${esc(l)}</div>`;
      }).join('');
      logEl.scrollTop = logEl.scrollHeight;
      $('finetuneStatus').textContent = task.status === 'running' ? '⏳ 运行中' :
        task.status === 'completed' ? '✅ 已完成' : '⏳ 等待中';
      if (task.status === 'completed' || task.status === 'failed') done = true;
      else await new Promise(r => setTimeout(r, 1500));
    } catch(e) { break; }
  }
}

loadResults();
</script>
</body>
</html>
