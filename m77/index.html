<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>手写公式识别 - LaTeX 渲染</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .header p {
            opacity: 0.9;
            font-size: 14px;
        }

        .main-content {
            display: flex;
            flex-wrap: wrap;
            padding: 30px;
            gap: 30px;
        }

        .canvas-section, .result-section {
            flex: 1;
            min-width: 350px;
        }

        .section-title {
            font-size: 18px;
            font-weight: 600;
            color: #333;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-title::before {
            content: '';
            width: 4px;
            height: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 2px;
        }

        .canvas-container {
            border: 3px solid #e0e0e0;
            border-radius: 12px;
            overflow: hidden;
            position: relative;
            background: #fafafa;
        }

        #drawingCanvas {
            display: block;
            cursor: crosshair;
            background: white;
            width: 100%;
            height: 400px;
        }

        .canvas-placeholder {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ccc;
            font-size: 16px;
            pointer-events: none;
            text-align: center;
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #f5f5f5;
            color: #666;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .result-box {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 25px;
            min-height: 400px;
            display: flex;
            flex-direction: column;
        }

        .latex-display {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px;
            background: white;
            border-radius: 8px;
            border: 2px dashed #e0e0e0;
            min-height: 200px;
            overflow-x: auto;
        }

        .latex-code {
            margin-top: 20px;
            padding: 15px;
            background: #2d2d2d;
            color: #f8f8f2;
            border-radius: 8px;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 13px;
            overflow-x: auto;
        }

        .empty-state {
            color: #999;
            text-align: center;
        }

        .empty-state svg {
            width: 60px;
            height: 60px;
            margin-bottom: 15px;
            opacity: 0.5;
        }

        .loading {
            display: none;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .spinner {
            width: 20px;
            height: 20px;
            border: 2px solid #f3f3f3;
            border-top: 2px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .toolbar {
            display: flex;
            gap: 15px;
            padding: 15px;
            background: #f5f5f5;
            border-top: 1px solid #e0e0e0;
        }

        .tool-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .tool-group label {
            font-size: 12px;
            color: #666;
        }

        .tool-group input[type="range"] {
            width: 80px;
        }

        .color-picker {
            width: 30px;
            height: 30px;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            padding: 0;
        }

        .status-bar {
            padding: 15px 30px;
            background: #f5f5f5;
            border-top: 1px solid #e0e0e0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            color: #666;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #4caf50;
        }

        .status-dot.offline {
            background: #f44336;
        }

        .main-wrapper {
            display: flex;
            position: relative;
        }

        .sidebar {
            width: 280px;
            background: #f8f9fa;
            border-left: 1px solid #e0e0e0;
            display: flex;
            flex-direction: column;
            max-height: calc(100vh - 160px);
            overflow: hidden;
        }

        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid #e0e0e0;
            background: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .sidebar-header h3 {
            font-size: 16px;
            font-weight: 600;
            color: #333;
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 0;
        }

        .sidebar-header .refresh-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 16px;
            color: #666;
            padding: 4px 8px;
            border-radius: 4px;
            transition: all 0.2s;
        }

        .sidebar-header .refresh-btn:hover {
            background: #f0f0f0;
            color: #667eea;
        }

        .sidebar-header .refresh-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .history-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }

        .history-item {
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            margin-bottom: 10px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.2s;
        }

        .history-item:hover {
            border-color: #667eea;
            box-shadow: 0 2px 10px rgba(102, 126, 234, 0.15);
            transform: translateY(-1px);
        }

        .history-thumbnail {
            width: 100%;
            height: 80px;
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            border-bottom: 1px solid #f0f0f0;
        }

        .history-thumbnail img {
            max-width: 95%;
            max-height: 70px;
            object-fit: contain;
        }

        .history-info {
            padding: 10px;
        }

        .history-expression {
            font-size: 13px;
            font-weight: 600;
            color: #333;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .history-latex {
            font-size: 11px;
            color: #888;
            font-family: 'Consolas', monospace;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .history-time {
            font-size: 10px;
            color: #aaa;
            margin-top: 4px;
        }

        .history-empty {
            text-align: center;
            color: #999;
            padding: 40px 20px;
            font-size: 13px;
        }

        .history-empty svg {
            width: 40px;
            height: 40px;
            margin-bottom: 10px;
            opacity: 0.5;
        }

        .sidebar-toggle {
            position: fixed;
            right: 0;
            top: 50%;
            transform: translateY(-50%);
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px 0 0 8px;
            padding: 12px 8px;
            cursor: pointer;
            z-index: 1000;
            transition: right 0.3s ease;
            display: none;
        }

        .sidebar-toggle.open {
            right: 280px;
        }

        @media (max-width: 768px) {
            .main-content {
                flex-direction: column;
            }

            .canvas-section, .result-section {
                min-width: auto;
            }

            #drawingCanvas {
                height: 300px;
            }

            .sidebar {
                position: fixed;
                right: -280px;
                top: 0;
                height: 100vh;
                z-index: 999;
                transition: right 0.3s ease;
                max-height: 100vh;
            }

            .sidebar.open {
                right: 0;
            }

            .sidebar-toggle {
                display: block;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>✏️ 手写数学公式识别</h1>
            <p>在画布上手写数学公式，AI 自动识别并渲染为 LaTeX</p>
        </div>

        <div class="main-wrapper">
            <div class="main-content">
                <div class="canvas-section">
                    <h2 class="section-title">手写区域</h2>
                    <div class="canvas-container">
                        <canvas id="drawingCanvas" width="500" height="400"></canvas>
                        <div class="canvas-placeholder" id="canvasPlaceholder">
                            在此处手写公式
                        </div>
                    </div>

                    <div class="toolbar">
                        <div class="tool-group">
                            <label>颜色:</label>
                            <input type="color" class="color-picker" id="colorPicker" value="#000000">
                        </div>
                        <div class="tool-group">
                            <label>粗细:</label>
                            <input type="range" id="brushSize" min="2" max="20" value="5">
                        </div>
                    </div>

                    <div class="controls">
                        <button class="btn btn-primary" id="recognizeBtn">
                            <span>🔍</span> 识别公式
                        </button>
                        <button class="btn btn-secondary" id="clearBtn">
                            <span>🗑️</span> 清空画布
                        </button>
                        <button class="btn btn-secondary" id="undoBtn">
                            <span>↩️</span> 撤销
                        </button>
                    </div>
                </div>

                <div class="result-section">
                    <h2 class="section-title">识别结果</h2>
                    <div class="result-box">
                        <div class="latex-display" id="latexDisplay">
                            <div class="empty-state" id="emptyState">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
                                    <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
                                </svg>
                                <p>识别结果将显示在这里</p>
                            </div>
                            <div class="loading" id="loadingState">
                                <div class="spinner"></div>
                                <span>正在识别中...</span>
                            </div>
                            <div id="katexContainer" style="display: none;"></div>
                        </div>
                        <div class="latex-code" id="latexCode" style="display: none;"></div>
                    </div>
                </div>
            </div>

            <aside class="sidebar" id="sidebar">
                <div class="sidebar-header">
                    <h3><span>📋</span> 历史记录</h3>
                    <button class="refresh-btn" id="refreshHistoryBtn" title="刷新">🔄</button>
                </div>
                <div class="history-list" id="historyList">
                    <div class="history-empty">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="10"></circle>
                            <polyline points="12,6 12,12 16,14"></polyline>
                        </svg>
                        <p>暂无识别记录</p>
                    </div>
                </div>
            </aside>

            <button class="sidebar-toggle" id="sidebarToggle">
                <span id="sidebarToggleIcon">◀</span>
            </button>
        </div>

        <div class="status-bar">
            <div class="status-indicator">
                <div class="status-dot" id="statusDot"></div>
                <span id="statusText">服务状态: 在线</span>
            </div>
            <div>
                支持识别: 0-9 数字, + - × ÷ = ( ) 等基础符号
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('drawingCanvas');
        const ctx = canvas.getContext('2d');
        const recognizeBtn = document.getElementById('recognizeBtn');
        const clearBtn = document.getElementById('clearBtn');
        const undoBtn = document.getElementById('undoBtn');
        const colorPicker = document.getElementById('colorPicker');
        const brushSize = document.getElementById('brushSize');
        const canvasPlaceholder = document.getElementById('canvasPlaceholder');
        const emptyState = document.getElementById('emptyState');
        const loadingState = document.getElementById('loadingState');
        const katexContainer = document.getElementById('katexContainer');
        const latexCode = document.getElementById('latexCode');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        const historyList = document.getElementById('historyList');
        const refreshHistoryBtn = document.getElementById('refreshHistoryBtn');
        const sidebar = document.getElementById('sidebar');
        const sidebarToggle = document.getElementById('sidebarToggle');
        const sidebarToggleIcon = document.getElementById('sidebarToggleIcon');

        const dpr = window.devicePixelRatio || 1;

        let isDrawing = false;
        let lastX = 0;
        let lastY = 0;
        let drawingHistory = [];
        let historyIndex = -1;
        let canvasLogicalWidth = 0;
        let canvasLogicalHeight = 0;
        let currentHistory = [];

        function initContext() {
            ctx.lineJoin = 'round';
            ctx.lineCap = 'round';
            ctx.lineWidth = parseFloat(brushSize.value);
            ctx.strokeStyle = colorPicker.value;
            ctx.imageSmoothingEnabled = true;
            ctx.imageSmoothingQuality = 'high';
        }

        function resizeCanvas() {
            const rect = canvas.getBoundingClientRect();
            canvasLogicalWidth = rect.width;
            canvasLogicalHeight = 400;

            canvas.width = Math.round(canvasLogicalWidth * dpr);
            canvas.height = Math.round(canvasLogicalHeight * dpr);
            canvas.style.width = canvasLogicalWidth + 'px';
            canvas.style.height = canvasLogicalHeight + 'px';

            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            initContext();

            if (drawingHistory.length > 0 && historyIndex >= 0) {
                restoreHistory();
            }
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function formatTimestamp(ts) {
            const date = new Date(ts * 1000);
            const now = new Date();
            const diff = now - date;
            if (diff < 60000) return '刚刚';
            if (diff < 3600000) return Math.floor(diff / 60000) + ' 分钟前';
            if (diff < 86400000) return Math.floor(diff / 3600000) + ' 小时前';
            return date.toLocaleDateString('zh-CN') + ' ' + date.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
        }

        async function loadHistory() {
            refreshHistoryBtn.disabled = true;
            try {
                const response = await fetch('http://localhost:8001/history');
                if (response.ok) {
                    const data = await response.json();
                    if (data.success) {
                        currentHistory = data.history;
                        renderHistory();
                    }
                }
            } catch (e) {
                console.error('加载历史记录失败:', e);
            } finally {
                refreshHistoryBtn.disabled = false;
            }
        }

        function renderHistory() {
            if (!currentHistory || currentHistory.length === 0) {
                historyList.innerHTML = `
                    <div class="history-empty">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="10"></circle>
                            <polyline points="12,6 12,12 16,14"></polyline>
                        </svg>
                        <p>暂无识别记录</p>
                    </div>
                `;
                return;
            }

            historyList.innerHTML = currentHistory.map((item, index) => `
                <div class="history-item" data-index="${index}" title="点击恢复此记录">
                    <div class="history-thumbnail">
                        <img src="${item.image}" alt="公式缩略图">
                    </div>
                    <div class="history-info">
                        <div class="history-expression">${item.expression || item.latex}</div>
                        <div class="history-latex">${item.latex}</div>
                        <div class="history-time">${formatTimestamp(item.timestamp)}</div>
                    </div>
                </div>
            `).join('');

            historyList.querySelectorAll('.history-item').forEach(item => {
                item.addEventListener('click', () => {
                    const index = parseInt(item.dataset.index);
                    restoreHistoryItem(currentHistory[index]);
                });
            });
        }

        function restoreHistoryItem(item) {
            if (!item) return;

            emptyState.style.display = 'none';
            loadingState.style.display = 'none';
            katexContainer.style.display = 'block';
            latexCode.style.display = 'block';

            katex.render(item.latex, katexContainer, {
                throwOnError: false,
                displayMode: true
            });
            latexCode.textContent = item.latex;

            const img = new Image();
            img.onload = () => {
                clearCanvas();
                ctx.save();
                ctx.setTransform(1, 0, 0, 1, 0, 0);
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                ctx.restore();
                canvasPlaceholder.style.display = 'none';
                saveState();
                drawingHistory.pop();
                historyIndex--;
            };
            img.src = item.image;

            if (window.innerWidth <= 768) {
                sidebar.classList.remove('open');
                sidebarToggle.classList.remove('open');
                sidebarToggleIcon.textContent = '◀';
            }
        }

        function toggleSidebar() {
            sidebar.classList.toggle('open');
            sidebarToggle.classList.toggle('open');
            sidebarToggleIcon.textContent = sidebar.classList.contains('open') ? '▶' : '◀';
        }

        refreshHistoryBtn.addEventListener('click', loadHistory);
        sidebarToggle.addEventListener('click', toggleSidebar);

        loadHistory();

        function saveState() {
            historyIndex++;
            drawingHistory = drawingHistory.slice(0, historyIndex);
            drawingHistory.push(canvas.toDataURL('image/png'));
            canvasPlaceholder.style.display = 'none';
        }

        function restoreHistory() {
            if (historyIndex >= 0 && drawingHistory[historyIndex]) {
                const img = new Image();
                img.onload = () => {
                    ctx.save();
                    ctx.setTransform(1, 0, 0, 1, 0, 0);
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    ctx.restore();
                };
                img.src = drawingHistory[historyIndex];
            }
        }

        function startDrawing(e) {
            isDrawing = true;
            const pos = getPosition(e);
            lastX = pos.x;
            lastY = pos.y;
            ctx.beginPath();
            ctx.moveTo(lastX, lastY);
            saveState();
        }

        function draw(e) {
            if (!isDrawing) return;
            e.preventDefault();

            const pos = getPosition(e);
            ctx.beginPath();
            ctx.moveTo(lastX, lastY);
            ctx.lineTo(pos.x, pos.y);
            ctx.stroke();

            lastX = pos.x;
            lastY = pos.y;
        }

        function stopDrawing() {
            if (isDrawing) {
                isDrawing = false;
            }
        }

        function getPosition(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return {
                x: (clientX - rect.left),
                y: (clientY - rect.top)
            };
        }

        canvas.addEventListener('mousedown', startDrawing);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('mouseup', stopDrawing);
        canvas.addEventListener('mouseout', stopDrawing);

        canvas.addEventListener('touchstart', (e) => { e.preventDefault(); startDrawing(e); }, { passive: false });
        canvas.addEventListener('touchmove', (e) => { e.preventDefault(); draw(e); }, { passive: false });
        canvas.addEventListener('touchend', stopDrawing);

        colorPicker.addEventListener('change', (e) => {
            ctx.strokeStyle = e.target.value;
        });

        brushSize.addEventListener('input', (e) => {
            ctx.lineWidth = parseFloat(e.target.value);
        });

        function clearCanvas() {
            ctx.save();
            ctx.setTransform(1, 0, 0, 1, 0, 0);
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.restore();
        }

        clearBtn.addEventListener('click', () => {
            clearCanvas();
            drawingHistory = [];
            historyIndex = -1;
            canvasPlaceholder.style.display = 'block';
            emptyState.style.display = 'block';
            katexContainer.style.display = 'none';
            latexCode.style.display = 'none';
        });

        undoBtn.addEventListener('click', () => {
            if (historyIndex > 0) {
                historyIndex--;
                restoreHistory();
            } else if (historyIndex === 0) {
                historyIndex--;
                clearCanvas();
                canvasPlaceholder.style.display = 'block';
            }
        });

        function getExportCanvas() {
            const exportCanvas = document.createElement('canvas');
            const exportW = Math.round(canvasLogicalWidth);
            const exportH = Math.round(canvasLogicalHeight);
            exportCanvas.width = exportW;
            exportCanvas.height = exportH;
            const exportCtx = exportCanvas.getContext('2d');
            exportCtx.fillStyle = '#ffffff';
            exportCtx.fillRect(0, 0, exportW, exportH);
            exportCtx.drawImage(canvas, 0, 0, exportW, exportH);
            return exportCanvas;
        }

        recognizeBtn.addEventListener('click', async () => {
            if (historyIndex < 0) {
                alert('请先在画布上书写公式');
                return;
            }

            emptyState.style.display = 'none';
            loadingState.style.display = 'flex';
            katexContainer.style.display = 'none';
            latexCode.style.display = 'none';
            recognizeBtn.disabled = true;

            try {
                const exportCanvas = getExportCanvas();
                const imageData = exportCanvas.toDataURL('image/png');

                const response = await fetch('http://localhost:8001/recognize', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ image: imageData }),
                });

                if (!response.ok) {
                    throw new Error('识别服务响应失败');
                }

                const result = await response.json();

                loadingState.style.display = 'none';
                katexContainer.style.display = 'block';
                latexCode.style.display = 'block';

                if (result.success) {
                    katex.render(result.latex, katexContainer, {
                        throwOnError: false,
                        displayMode: true
                    });
                    latexCode.textContent = result.latex;
                    loadHistory();
                } else {
                    katexContainer.innerHTML = `<p style="color: #f44336;">识别失败: ${result.error}</p>`;
                }

                statusDot.classList.remove('offline');
                statusText.textContent = '服务状态: 在线';

            } catch (error) {
                loadingState.style.display = 'none';
                katexContainer.style.display = 'block';
                katexContainer.innerHTML = `<p style="color: #f44336;">连接失败: 请确保后端服务已启动</p>`;
                statusDot.classList.add('offline');
                statusText.textContent = '服务状态: 离线';
                console.error('识别错误:', error);
            } finally {
                recognizeBtn.disabled = false;
            }
        });

        drawingHistory = [];
        historyIndex = -1;
    </script>
</body>
</html>
