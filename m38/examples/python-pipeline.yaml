pipeline:
  name: python-app
  triggers:
    - event: push
      branch: main
  steps:
    - name: clone
      image: alpine/git:v2.36.3
      commands:
        - git clone $REPO_URL .
        - git checkout $BRANCH
    - name: install
      image: python:3.11-slim
      commands:
        - pip install -r requirements.txt
    - name: lint
      image: python:3.11-slim
      commands:
        - pip install flake8
        - flake8 src/
    - name: test
      image: python:3.11-slim
      commands:
        - pytest tests/
    - name: build
      image: python:3.11-slim
      commands:
        - python setup.py bdist_wheel
