<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Point Cloud Renderer - 1M Points</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0a0f; overflow: hidden; font-family: 'Segoe UI', system-ui, sans-serif; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #overlay {
    position: fixed; top: 16px; left: 16px; z-index: 10;
    color: #e0e0e0; font-size: 13px; pointer-events: none;
    background: rgba(10, 10, 15, 0.75); padding: 14px 18px;
    border-radius: 10px; border: 1px solid rgba(255,255,255,0.08);
    backdrop-filter: blur(10px); line-height: 1.7;
    min-width: 220px;
  }
  #overlay h2 {
    font-size: 15px; font-weight: 600; margin-bottom: 8px;
    color: #8ab4f8; letter-spacing: 0.5px;
  }
  #overlay .stat { color: #aaa; }
  #overlay .stat span { color: #fff; font-weight: 500; }
  #loading {
    position: fixed; inset: 0; z-index: 100;
    display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 16px;
    background: #0a0a0f; color: #e0e0e0; font-size: 18px;
  }
  #loading .spinner {
    width: 40px; height: 40px;
    border: 3px solid rgba(255,255,255,0.1);
    border-top-color: #8ab4f8;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #controls-hint {
    position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
    color: rgba(255,255,255,0.35); font-size: 12px; z-index: 10;
    pointer-events: none; letter-spacing: 0.3px;
  }
  #selection-rect {
    position: fixed; z-index: 50; pointer-events: none;
    border: 2px dashed #8ab4f8;
    background: rgba(138, 180, 248, 0.08);
    display: none;
  }
  #selection-info {
    position: fixed; bottom: 50px; left: 50%; transform: translateX(-50%);
    z-index: 60; display: none;
    background: rgba(10, 10, 15, 0.9); color: #e0e0e0;
    padding: 12px 20px; border-radius: 8px;
    border: 1px solid rgba(138, 180, 248, 0.3);
    font-size: 13px; line-height: 1.6; text-align: center;
  }
  #selection-info .highlight { color: #8ab4f8; font-weight: 600; }
  #selection-info button {
    margin-top: 8px; padding: 6px 16px;
    background: #8ab4f8; color: #0a0a0f;
    border: none; border-radius: 4px; cursor: pointer;
    font-size: 13px; font-weight: 600;
    pointer-events: all;
  }
  #selection-info button:hover { background: #a8c8fa; }
  #selection-info button:disabled { opacity: 0.5; cursor: wait; }
  #selection-info .close-btn {
    background: transparent; color: #aaa;
    font-size: 12px; margin-left: 8px;
    padding: 6px 10px;
  }
  #selection-info .close-btn:hover { color: #fff; }
  #toast {
    position: fixed; top: 20px; right: 20px; z-index: 200;
    background: rgba(30, 30, 40, 0.95); color: #e0e0e0;
    padding: 12px 18px; border-radius: 8px;
    border-left: 3px solid #8ab4f8;
    font-size: 13px; display: none;
    animation: slideIn 0.3s ease;
  }
  @keyframes slideIn { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }
</style>
</head>
<body>

<div id="loading">
  <div class="spinner"></div>
  <div id="loading-text">Initializing WebGPU...</div>
</div>

<div id="overlay" style="display:none;">
  <h2>☁ Point Cloud Renderer</h2>
  <div class="stat">Points: <span id="stat-points">—</span></div>
  <div class="stat">Data size: <span id="stat-size">—</span></div>
  <div class="stat">FPS: <span id="stat-fps">—</span></div>
  <div class="stat">GPU: <span id="stat-gpu">—</span></div>
  <div class="stat">Selected: <span id="stat-selected">0</span></div>
</div>

<div id="selection-rect"></div>

<div id="selection-info">
  <div>Selected <span class="highlight" id="sel-count">0</span> points in 3D bounding box</div>
  <div style="font-size:11px;color:#888;margin-top:4px;">
    AABB: [<span id="sel-aabb">—</span>]
  </div>
  <div>
    <button id="btn-export">📥 Export CSV via Octree Query</button>
    <button id="btn-cancel" class="close-btn">✕ Close</button>
  </div>
</div>

<div id="toast"></div>

<div id="controls-hint">🖱 Drag: Rotate &nbsp;|&nbsp; Right drag: Pan &nbsp;|&nbsp; Scroll: Zoom &nbsp;|&nbsp; ⇧ Shift+Drag: Select</div>

<canvas id="canvas"></canvas>

<script>
(async function main() {
  const canvas = document.getElementById("canvas");
  const loadingEl = document.getElementById("loading");
  const loadingText = document.getElementById("loading-text");
  const overlayEl = document.getElementById("overlay");
  const selectionRectEl = document.getElementById("selection-rect");
  const selectionInfoEl = document.getElementById("selection-info");
  const toastEl = document.getElementById("toast");

  function showToast(msg, duration) {
    toastEl.textContent = msg;
    toastEl.style.display = "block";
    clearTimeout(showToast._timer);
    showToast._timer = setTimeout(() => { toastEl.style.display = "none"; }, duration || 3000);
  }

  if (!navigator.gpu) {
    loadingText.textContent = "WebGPU is not supported in this browser.";
    return;
  }

  const adapter = await navigator.gpu.requestAdapter({ powerPreference: "high-performance" });
  if (!adapter) {
    loadingText.textContent = "Failed to get GPU adapter.";
    return;
  }

  const device = await adapter.requestDevice();
  try {
    const adapterInfo = adapter.info || (await adapter.requestAdapterInfo?.());
    document.getElementById("stat-gpu").textContent = adapterInfo?.description || adapterInfo?.vendor || "Unknown";
  } catch { document.getElementById("stat-gpu").textContent = "Unknown"; }

  loadingText.textContent = "Fetching 1M point cloud data...";

  const t0 = performance.now();
  const response = await fetch("/api/pointcloud");
  const totalSize = parseInt(response.headers.get("Content-Length"), 10);
  const pointCount = totalSize / 24;
  const dataSizeMB = (totalSize / (1024 * 1024)).toFixed(1);

  document.getElementById("stat-points").textContent = pointCount.toLocaleString();
  document.getElementById("stat-size").textContent = dataSizeMB + " MB";

  loadingText.textContent = "Streaming data to GPU (0%)...";

  const alignedVertexSize = Math.ceil(totalSize / 4) * 4;
  const vertexBuffer = device.createBuffer({
    size: alignedVertexSize,
    usage: GPUBufferUsage.VERTEX,
    mappedAtCreation: true,
  });

  const mappedRange = vertexBuffer.getMappedRange();
  const mappedBytes = new Uint8Array(mappedRange);
  let bytesReceived = 0;

  const reader = response.body.getReader();
  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    mappedBytes.set(value, bytesReceived);
    bytesReceived += value.length;
    const pct = ((bytesReceived / totalSize) * 100).toFixed(0);
    loadingText.textContent = `Streaming data to GPU (${pct}%)...`;
    await new Promise(r => setTimeout(r, 0));
  }

  const cpuPositionData = new Float32Array(pointCount * 3);
  const srcView = new Float32Array(mappedRange);
  for (let i = 0; i < pointCount; i++) {
    cpuPositionData[i * 3] = srcView[i * 6];
    cpuPositionData[i * 3 + 1] = srcView[i * 6 + 1];
    cpuPositionData[i * 3 + 2] = srcView[i * 6 + 2];
  }

  vertexBuffer.unmap();
  const fetchTime = ((performance.now() - t0) / 1000).toFixed(2);
  loadingText.textContent = `Data loaded in ${fetchTime}s. Creating pipeline...`;

  canvas.width = window.innerWidth * devicePixelRatio;
  canvas.height = window.innerHeight * devicePixelRatio;
  canvas.style.width = window.innerWidth + "px";
  canvas.style.height = window.innerHeight + "px";

  const context = canvas.getContext("webgpu");
  const presentationFormat = navigator.gpu.getPreferredCanvasFormat();

  context.configure({
    device,
    format: presentationFormat,
    alphaMode: "premultiplied",
  });

  const minUniformAlignment = device.limits.minUniformBufferOffsetAlignment;
  const uniformDataSize = 4 * 16 * 3;
  const uniformBufferSize = Math.ceil(uniformDataSize / minUniformAlignment) * minUniformAlignment;
  const uniformBuffer = device.createBuffer({
    size: uniformBufferSize,
    usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST,
  });
  const uniformData = new Float32Array(uniformDataSize / 4);

  const shaderModule = device.createShaderModule({
    code: `
struct Uniforms {
  modelView: mat4x4<f32>,
  projection: mat4x4<f32>,
  normal: mat4x4<f32>,
};

@group(0) @binding(0) var<uniform> uniforms: Uniforms;

struct VertexInput {
  @location(0) position: vec3<f32>,
  @location(1) color: vec3<f32>,
};

struct VertexOutput {
  @builtin(position) clipPosition: vec4<f32>,
  @location(0) vColor: vec3<f32>,
  @location(1) vDepth: f32,
};

@vertex
fn vs_main(input: VertexInput) -> VertexOutput {
  var output: VertexOutput;
  let worldPos = uniforms.modelView * vec4<f32>(input.position, 1.0);
  output.clipPosition = uniforms.projection * worldPos;
  output.vColor = input.color;
  output.vDepth = -worldPos.z;
  return output;
}

@fragment
fn fs_main(input: VertexOutput) -> @location(0) vec4<f32> {
  let depthFade = clamp(1.0 - input.vDepth / 6.0, 0.3, 1.0);
  let brightness = pow(depthFade, 0.8);
  let color = input.vColor * brightness;
  return vec4<f32>(color, 0.9);
}
`,
  });

  const UNIFORM_STRUCT_SIZE = 192;
  const bindGroupLayout = device.createBindGroupLayout({
    entries: [{
      binding: 0,
      visibility: GPUShaderStage.VERTEX | GPUShaderStage.FRAGMENT,
      buffer: { type: "uniform", minBindingSize: UNIFORM_STRUCT_SIZE },
    }],
  });

  const bindGroup = device.createBindGroup({
    layout: bindGroupLayout,
    entries: [{
      binding: 0,
      resource: { buffer: uniformBuffer },
    }],
  });

  const pipelineLayout = device.createPipelineLayout({
    bindGroupLayouts: [bindGroupLayout],
  });

  const pipeline = device.createRenderPipeline({
    layout: pipelineLayout,
    vertex: {
      module: shaderModule,
      entryPoint: "vs_main",
      buffers: [{
        arrayStride: 24,
        attributes: [
          { shaderLocation: 0, offset: 0, format: "float32x3" },
          { shaderLocation: 1, offset: 12, format: "float32x3" },
        ],
      }],
    },
    fragment: {
      module: shaderModule,
      entryPoint: "fs_main",
      targets: [{
        format: presentationFormat,
        blend: {
          color: {
            srcFactor: "src-alpha",
            dstFactor: "one-minus-src-alpha",
            operation: "add",
          },
          alpha: {
            srcFactor: "one",
            dstFactor: "one-minus-src-alpha",
            operation: "add",
          },
        },
      }],
    },
    primitive: { topology: "point-list" },
    depthStencil: {
      depthWriteEnabled: true,
      depthCompare: "less",
      format: "depth24plus",
    },
  });

  let depthTexture = device.createTexture({
    size: [canvas.width, canvas.height],
    format: "depth24plus",
    usage: GPUTextureUsage.RENDER_ATTACHMENT,
  });

  const mat4 = {
    create() { return new Float32Array(16); },
    identity(out) {
      out.fill(0);
      out[0] = out[5] = out[10] = out[15] = 1;
      return out;
    },
    perspective(out, fovy, aspect, near, far) {
      const f = 1.0 / Math.tan(fovy / 2);
      out.fill(0);
      out[0] = f / aspect;
      out[5] = f;
      out[10] = (far + near) / (near - far);
      out[11] = -1;
      out[14] = (2 * far * near) / (near - far);
      return out;
    },
    lookAt(out, eye, center, up) {
      let zx = eye[0] - center[0], zy = eye[1] - center[1], zz = eye[2] - center[2];
      let len = Math.sqrt(zx * zx + zy * zy + zz * zz);
      if (len > 0) { len = 1 / len; zx *= len; zy *= len; zz *= len; }

      let xx = up[1] * zz - up[2] * zy;
      let xy = up[2] * zx - up[0] * zz;
      let xz = up[0] * zy - up[1] * zx;
      len = Math.sqrt(xx * xx + xy * xy + xz * xz);
      if (len > 0) { len = 1 / len; xx *= len; xy *= len; xz *= len; }

      let yx = zy * xz - zz * xy;
      let yy = zz * xx - zx * xz;
      let yz = zx * xy - zy * xx;

      out[0] = xx; out[1] = yx; out[2] = zx; out[3] = 0;
      out[4] = xy; out[5] = yy; out[6] = zy; out[7] = 0;
      out[8] = xz; out[9] = yz; out[10] = zz; out[11] = 0;
      out[12] = -(xx * eye[0] + xy * eye[1] + xz * eye[2]);
      out[13] = -(yx * eye[0] + yy * eye[1] + yz * eye[2]);
      out[14] = -(zx * eye[0] + zy * eye[1] + zz * eye[2]);
      out[15] = 1;
      return out;
    },
    multiply(out, a, b) {
      const r = new Float32Array(16);
      for (let i = 0; i < 4; i++) {
        for (let j = 0; j < 4; j++) {
          r[j * 4 + i] =
            a[i] * b[j * 4] + a[4 + i] * b[j * 4 + 1] +
            a[8 + i] * b[j * 4 + 2] + a[12 + i] * b[j * 4 + 3];
        }
      }
      out.set(r);
      return out;
    },
    rotateX(out, a, rad) {
      const s = Math.sin(rad), c = Math.cos(rad);
      const rot = mat4.identity(mat4.create());
      rot[5] = c; rot[6] = s; rot[9] = -s; rot[10] = c;
      return mat4.multiply(out, a, rot);
    },
    rotateY(out, a, rad) {
      const s = Math.sin(rad), c = Math.cos(rad);
      const rot = mat4.identity(mat4.create());
      rot[0] = c; rot[2] = -s; rot[8] = s; rot[10] = c;
      return mat4.multiply(out, a, rot);
    },
    translate(out, a, v) {
      const t = mat4.identity(mat4.create());
      t[12] = v[0]; t[13] = v[1]; t[14] = v[2];
      return mat4.multiply(out, a, t);
    },
    invert(out, a) {
      const a00 = a[0], a01 = a[1], a02 = a[2], a03 = a[3];
      const a10 = a[4], a11 = a[5], a12 = a[6], a13 = a[7];
      const a20 = a[8], a21 = a[9], a22 = a[10], a23 = a[11];
      const a30 = a[12], a31 = a[13], a32 = a[14], a33 = a[15];
      const b00 = a00 * a11 - a01 * a10;
      const b01 = a00 * a12 - a02 * a10;
      const b02 = a00 * a13 - a03 * a10;
      const b03 = a01 * a12 - a02 * a11;
      const b04 = a01 * a13 - a03 * a11;
      const b05 = a02 * a13 - a03 * a12;
      const b06 = a20 * a31 - a21 * a30;
      const b07 = a20 * a32 - a22 * a30;
      const b08 = a20 * a33 - a23 * a30;
      const b09 = a21 * a32 - a22 * a31;
      const b10 = a21 * a33 - a23 * a31;
      const b11 = a22 * a33 - a23 * a32;
      let det = b00 * b11 - b01 * b10 + b02 * b09 + b03 * b08 - b04 * b07 + b05 * b06;
      if (!det) return out;
      det = 1.0 / det;
      out[0] = (a11 * b11 - a12 * b10 + a13 * b09) * det;
      out[1] = (a02 * b10 - a01 * b11 - a03 * b09) * det;
      out[2] = (a31 * b05 - a32 * b04 + a33 * b03) * det;
      out[3] = (a22 * b04 - a21 * b05 - a23 * b03) * det;
      out[4] = (a12 * b08 - a10 * b11 - a13 * b07) * det;
      out[5] = (a00 * b11 - a02 * b08 + a03 * b07) * det;
      out[6] = (a32 * b02 - a30 * b05 - a33 * b01) * det;
      out[7] = (a20 * b05 - a22 * b02 + a23 * b01) * det;
      out[8] = (a10 * b10 - a11 * b08 + a13 * b06) * det;
      out[9] = (a01 * b08 - a00 * b10 - a03 * b06) * det;
      out[10] = (a30 * b04 - a31 * b02 + a33 * b00) * det;
      out[11] = (a21 * b02 - a20 * b04 - a23 * b00) * det;
      out[12] = (a11 * b07 - a10 * b09 - a12 * b06) * det;
      out[13] = (a00 * b09 - a01 * b07 + a02 * b06) * det;
      out[14] = (a31 * b01 - a30 * b03 - a32 * b00) * det;
      out[15] = (a20 * b03 - a21 * b01 + a22 * b00) * det;
      return out;
    },
    transpose(out, a) {
      const r = new Float32Array(16);
      for (let i = 0; i < 4; i++)
        for (let j = 0; j < 4; j++)
          r[j * 4 + i] = a[i * 4 + j];
      out.set(r);
      return out;
    },
    transformVec4(m, v) {
      return [
        m[0]*v[0] + m[4]*v[1] + m[8]*v[2]  + m[12]*v[3],
        m[1]*v[0] + m[5]*v[1] + m[9]*v[2]  + m[13]*v[3],
        m[2]*v[0] + m[6]*v[1] + m[10]*v[2] + m[14]*v[3],
        m[3]*v[0] + m[7]*v[1] + m[11]*v[2] + m[15]*v[3],
      ];
    }
  };

  let rotX = 0.3;
  let rotY = 0.0;
  let zoom = 3.0;
  let panX = 0;
  let panY = 0;

  let isDragging = false;
  let isRightDragging = false;
  let isSelecting = false;
  let lastMouseX = 0;
  let lastMouseY = 0;
  let selStartX = 0;
  let selStartY = 0;

  let currentAABB = null;
  let selectedCount = 0;

  canvas.addEventListener("mousedown", (e) => {
    if (e.shiftKey && e.button === 0) {
      isSelecting = true;
      selStartX = e.clientX;
      selStartY = e.clientY;
      selectionRectEl.style.display = "block";
      selectionRectEl.style.left = selStartX + "px";
      selectionRectEl.style.top = selStartY + "px";
      selectionRectEl.style.width = "0px";
      selectionRectEl.style.height = "0px";
      return;
    }
    if (e.button === 0) { isDragging = true; }
    if (e.button === 2) { isRightDragging = true; }
    lastMouseX = e.clientX;
    lastMouseY = e.clientY;
  });

  window.addEventListener("mouseup", (e) => {
    if (isSelecting && e.button === 0) {
      isSelecting = false;
      selectionRectEl.style.display = "none";
      finishSelection(e.clientX, e.clientY);
      return;
    }
    if (e.button === 0) isDragging = false;
    if (e.button === 2) isRightDragging = false;
  });

  canvas.addEventListener("contextmenu", (e) => e.preventDefault());

  window.addEventListener("mousemove", (e) => {
    if (isSelecting) {
      const x1 = Math.min(selStartX, e.clientX);
      const y1 = Math.min(selStartY, e.clientY);
      const x2 = Math.max(selStartX, e.clientX);
      const y2 = Math.max(selStartY, e.clientY);
      selectionRectEl.style.left = x1 + "px";
      selectionRectEl.style.top = y1 + "px";
      selectionRectEl.style.width = (x2 - x1) + "px";
      selectionRectEl.style.height = (y2 - y1) + "px";
      return;
    }

    const dx = e.clientX - lastMouseX;
    const dy = e.clientY - lastMouseY;
    if (isDragging) {
      rotY += dx * 0.005;
      rotX += dy * 0.005;
      rotX = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, rotX));
    }
    if (isRightDragging) {
      panX += dx * 0.003 * zoom;
      panY -= dy * 0.003 * zoom;
    }
    lastMouseX = e.clientX;
    lastMouseY = e.clientY;
  });

  canvas.addEventListener("wheel", (e) => {
    e.preventDefault();
    zoom *= 1 + e.deltaY * 0.001;
    zoom = Math.max(0.5, Math.min(20, zoom));
  }, { passive: false });

  let touchStartDist = 0;
  let touchStartZoom = 0;
  canvas.addEventListener("touchstart", (e) => {
    if (e.touches.length === 1) {
      isDragging = true;
      lastMouseX = e.touches[0].clientX;
      lastMouseY = e.touches[0].clientY;
    } else if (e.touches.length === 2) {
      isDragging = false;
      const dx = e.touches[1].clientX - e.touches[0].clientX;
      const dy = e.touches[1].clientY - e.touches[0].clientY;
      touchStartDist = Math.sqrt(dx * dx + dy * dy);
      touchStartZoom = zoom;
    }
  });

  canvas.addEventListener("touchmove", (e) => {
    e.preventDefault();
    if (e.touches.length === 1 && isDragging) {
      const dx = e.touches[0].clientX - lastMouseX;
      const dy = e.touches[0].clientY - lastMouseY;
      rotY += dx * 0.005;
      rotX += dy * 0.005;
      rotX = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, rotX));
      lastMouseX = e.touches[0].clientX;
      lastMouseY = e.touches[0].clientY;
    } else if (e.touches.length === 2) {
      const dx = e.touches[1].clientX - e.touches[0].clientX;
      const dy = e.touches[1].clientY - e.touches[0].clientY;
      const dist = Math.sqrt(dx * dx + dy * dy);
      zoom = touchStartZoom * (touchStartDist / dist);
      zoom = Math.max(0.5, Math.min(20, zoom));
    }
  }, { passive: false });

  canvas.addEventListener("touchend", () => { isDragging = false; });

  function finishSelection(endX, endY) {
    const x1 = Math.min(selStartX, endX);
    const y1 = Math.min(selStartY, endY);
    const x2 = Math.max(selStartX, endX);
    const y2 = Math.max(selStartY, endY);

    if (x2 - x1 < 5 || y2 - y1 < 5) {
      selectionInfoEl.style.display = "none";
      return;
    }

    const mvp = mat4.create();
    mat4.multiply(mvp, projectionMatrix, modelViewMatrix);

    const w = canvas.width;
    const h = canvas.height;
    const dpr = devicePixelRatio;
    const sx1 = x1 * dpr;
    const sy1 = y1 * dpr;
    const sx2 = x2 * dpr;
    const sy2 = y2 * dpr;

    const ndcX1 = (sx1 / w) * 2 - 1;
    const ndcY1 = 1 - (sy1 / h) * 2;
    const ndcX2 = (sx2 / w) * 2 - 1;
    const ndcY2 = 1 - (sy2 / h) * 2;

    let aabbMinX = Infinity, aabbMinY = Infinity, aabbMinZ = Infinity;
    let aabbMaxX = -Infinity, aabbMaxY = -Infinity, aabbMaxZ = -Infinity;
    let count = 0;

    const BATCH_SIZE = 100000;
    let offset = 0;

    function processBatch() {
      const end = Math.min(offset + BATCH_SIZE, pointCount);
      for (let i = offset; i < end; i++) {
        const pOff = i * 3;
        const px = cpuPositionData[pOff];
        const py = cpuPositionData[pOff + 1];
        const pz = cpuPositionData[pOff + 2];

        const clip = mat4.transformVec4(mvp, [px, py, pz, 1.0]);
        if (clip[3] <= 0) continue;

        const ndcX = clip[0] / clip[3];
        const ndcY = clip[1] / clip[3];

        if (ndcX >= ndcX1 && ndcX <= ndcX2 && ndcY >= ndcY1 && ndcY <= ndcY2) {
          count++;
          if (px < aabbMinX) aabbMinX = px; if (px > aabbMaxX) aabbMaxX = px;
          if (py < aabbMinY) aabbMinY = py; if (py > aabbMaxY) aabbMaxY = py;
          if (pz < aabbMinZ) aabbMinZ = pz; if (pz > aabbMaxZ) aabbMaxZ = pz;
        }
      }
      offset = end;

      if (offset < pointCount) {
        setTimeout(processBatch, 0);
      } else {
        if (count === 0) {
          selectionInfoEl.style.display = "none";
          showToast("No points found in selection area", 2000);
          return;
        }

        currentAABB = {
          minX: aabbMinX, minY: aabbMinY, minZ: aabbMinZ,
          maxX: aabbMaxX, maxY: aabbMaxY, maxZ: aabbMaxZ,
        };
        selectedCount = count;

        document.getElementById("stat-selected").textContent = count.toLocaleString();
        document.getElementById("sel-count").textContent = count.toLocaleString();
        document.getElementById("sel-aabb").textContent =
          `${aabbMinX.toFixed(2)},${aabbMinY.toFixed(2)},${aabbMinZ.toFixed(2)} → ${aabbMaxX.toFixed(2)},${aabbMaxY.toFixed(2)},${aabbMaxZ.toFixed(2)}`;
        selectionInfoEl.style.display = "block";
        document.getElementById("btn-export").disabled = false;
      }
    }

    showToast("Computing selection...", 2000);
    processBatch();
  }

  document.getElementById("btn-export").addEventListener("click", async () => {
    if (!currentAABB) return;
    const btn = document.getElementById("btn-export");
    btn.disabled = true;
    btn.textContent = "⏳ Querying Octree...";

    try {
      const resp = await fetch("/api/query", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(currentAABB),
      });

      if (!resp.ok) {
        throw new Error(`Server returned ${resp.status}`);
      }

      const queryTime = resp.headers.get("X-Query-Time-Ms");
      const resultCount = resp.headers.get("X-Result-Count");

      const blob = await resp.blob();
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "pointcloud_query.csv";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);

      showToast(`✅ Exported ${parseInt(resultCount).toLocaleString()} points (Octree query: ${queryTime}ms)`, 4000);
    } catch (e) {
      showToast("❌ Export failed: " + e.message, 4000);
    }

    btn.textContent = "📥 Export CSV via Octree Query";
    btn.disabled = false;
  });

  document.getElementById("btn-cancel").addEventListener("click", () => {
    selectionInfoEl.style.display = "none";
    currentAABB = null;
    selectedCount = 0;
    document.getElementById("stat-selected").textContent = "0";
  });

  const modelViewMatrix = mat4.create();
  const projectionMatrix = mat4.create();
  const normalMatrix = mat4.create();

  function updateUniforms() {
    const aspect = canvas.width / canvas.height;
    mat4.perspective(projectionMatrix, Math.PI / 3, aspect, 0.01, 100.0);

    mat4.identity(modelViewMatrix);
    mat4.translate(modelViewMatrix, modelViewMatrix, [panX, panY, -zoom]);
    mat4.rotateX(modelViewMatrix, modelViewMatrix, rotX);
    mat4.rotateY(modelViewMatrix, modelViewMatrix, rotY);

    const inv = mat4.create();
    mat4.invert(inv, modelViewMatrix);
    mat4.transpose(normalMatrix, inv);

    uniformData.set(modelViewMatrix, 0);
    uniformData.set(projectionMatrix, 16);
    uniformData.set(normalMatrix, 32);

    device.queue.writeBuffer(uniformBuffer, 0, uniformData);
  }

  let frameCount = 0;
  let lastFpsTime = performance.now();
  const fpsEl = document.getElementById("stat-fps");

  function render() {
    frameCount++;
    const now = performance.now();
    if (now - lastFpsTime >= 1000) {
      fpsEl.textContent = frameCount;
      frameCount = 0;
      lastFpsTime = now;
    }

    updateUniforms();

    const commandEncoder = device.createCommandEncoder();
    const textureView = context.getCurrentTexture().createView();

    const renderPass = commandEncoder.beginRenderPass({
      colorAttachments: [{
        view: textureView,
        clearValue: { r: 0.02, g: 0.02, b: 0.04, a: 1.0 },
        loadOp: "clear",
        storeOp: "store",
      }],
      depthStencilAttachment: {
        view: depthTexture.createView(),
        depthClearValue: 1.0,
        depthLoadOp: "clear",
        depthStoreOp: "store",
      },
    });

    renderPass.setPipeline(pipeline);
    renderPass.setBindGroup(0, bindGroup);
    renderPass.setVertexBuffer(0, vertexBuffer);
    renderPass.draw(pointCount);
    renderPass.end();

    device.queue.submit([commandEncoder.finish()]);
    requestAnimationFrame(render);
  }

  window.addEventListener("resize", () => {
    canvas.width = window.innerWidth * devicePixelRatio;
    canvas.height = window.innerHeight * devicePixelRatio;
    canvas.style.width = window.innerWidth + "px";
    canvas.style.height = window.innerHeight + "px";
    context.configure({
      device,
      format: presentationFormat,
      alphaMode: "premultiplied",
    });
    depthTexture.destroy();
    depthTexture = device.createTexture({
      size: [canvas.width, canvas.height],
      format: "depth24plus",
      usage: GPUTextureUsage.RENDER_ATTACHMENT,
    });
  });

  loadingEl.style.display = "none";
  overlayEl.style.display = "block";

  requestAnimationFrame(render);
})();
</script>
</body>
</html>
