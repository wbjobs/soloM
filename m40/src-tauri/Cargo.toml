[package]
name = "lan-share"
version = "1.0.0"
description = "Cross-platform LAN file sharing and clipboard sync"
authors = ["you"]
license = ""
repository = ""
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.5", features = ["shell-open"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.35", features = ["full"] }
warp = "0.3"
ureq = { version = "2.8", features = ["json"] }
local-ip-address = "0.5"
hostname = "0.4"
clipboard = "0.5"
dirs = "5.0"
bytes = "1.5"
futures-util = "0.3"
qrcode = "0.14"
image = "0.25"
base64 = "0.22"
rsa = { version = "0.9", features = ["pem"] }
aes-gcm = "0.10"
rand = "0.8"
sha2 = "0.10"
hex = "0.4"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
