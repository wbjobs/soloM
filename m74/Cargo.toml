[package]
name = "sql_query_cli"
version = "0.1.0"
edition = "2021"

[dependencies]
datafusion = "43.0"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
arrow = "54"
arrow-array = "54"
