<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRDT 协同代码编辑器</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="header-left">
        <h1 class="logo">✏️ CRDT 协同编辑器</h1>
        <span class="doc-id">文档: <span id="docId">default</span></span>
      </div>
      <div class="header-right">
        <div class="status" id="status">
          <span class="status-icon" id="statusIcon"></span>
          <span class="status-text" id="statusText">连接中...</span>
        </div>
        <div class="users" id="users"></div>
        <select id="languageSelect" class="language-select">
          <option value="javascript">JavaScript</option>
          <option value="typescript">TypeScript</option>
          <option value="python">Python</option>
          <option value="html">HTML</option>
          <option value="css">CSS</option>
          <option value="json">JSON</option>
          <option value="markdown">Markdown</option>
        </select>
      </div>
    </header>
    <div class="editor-wrapper">
      <div class="editor-container">
        <div id="editor"></div>
      </div>
      <div class="comments-panel" id="commentsPanel">
        <div class="comments-header">
          <span class="comments-title">💬 代码评论</span>
          <span class="comments-count" id="commentsCount">0</span>
        </div>
        <div class="comments-list" id="commentsList"></div>
      </div>
    </div>
    <footer class="footer">
      <div class="footer-left">
        <span id="lineInfo">行 1, 列 1</span>
      </div>
      <div class="footer-right">
        <span class="sync-status" id="syncStatus"></span>
        <button id="forceSyncBtn" class="btn">强制同步</button>
        <button id="clearBtn" class="btn">清空本地缓存</button>
      </div>
    </footer>
  </div>
  
  <div class="comment-modal-overlay" id="commentModal">
    <div class="comment-modal">
      <div class="comment-modal-header">
        <h3>添加评论</h3>
        <span class="comment-line-info" id="commentLineInfo">第 1 行</span>
        <button class="close-btn" id="closeCommentModal">×</button>
      </div>
      <div class="comment-modal-body">
        <textarea class="comment-input" id="commentInput" placeholder="输入评论内容..." rows="4"></textarea>
      </div>
      <div class="comment-modal-footer">
        <button class="btn btn-cancel" id="cancelComment">取消</button>
        <button class="btn btn-submit" id="submitComment">添加评论</button>
      </div>
    </div>
  </div>
  
  <script type="module" src="/main.js"></script>
</body>
</html>
