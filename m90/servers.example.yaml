# 分布式服务器集群配置示例
# 将此文件复制到 ~/.cluster-audit/servers.yaml 或使用 -c 参数指定

servers:
  # 密码认证示例
  - name: web-server-01
    host: 192.168.1.101
    port: 22
    username: root
    password: your_password_here
    timeout: 10000

  # 私钥认证示例
  - name: db-server-01
    host: 192.168.1.102
    port: 22
    username: admin
    privateKey: ~/.ssh/id_rsa
    # passphrase: your_private_key_passphrase

  # 更多服务器...
  - name: app-server-01
    host: 192.168.1.103
    port: 22
    username: deploy
    privateKey: ~/.ssh/deploy_key
