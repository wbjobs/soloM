apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudmon-anomaly
  namespace: cloudmon
  labels:
    app.kubernetes.io/name: cloudmon-anomaly
    app.kubernetes.io/component: ml-detector
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudmon-anomaly
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloudmon-anomaly
        app.kubernetes.io/component: ml-detector
    spec:
      containers:
        - name: anomaly
          image: cloudmon/netwatch-anomaly:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
              name: http
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: cloudmon-anomaly
  namespace: cloudmon
  labels:
    app.kubernetes.io/name: cloudmon-anomaly
spec:
  type: ClusterIP
  ports:
    - port: 5000
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: cloudmon-anomaly
