apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudmon-frontend
  namespace: cloudmon
  labels:
    app.kubernetes.io/name: cloudmon-frontend
    app.kubernetes.io/component: dashboard
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudmon-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloudmon-frontend
        app.kubernetes.io/component: dashboard
    spec:
      containers:
        - name: frontend
          image: cloudmon/netwatch-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: cloudmon-frontend
  namespace: cloudmon
  labels:
    app.kubernetes.io/name: cloudmon-frontend
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: cloudmon-frontend
---
apiVersion: v1
kind: Service
metadata:
  name: cloudmon-agent
  namespace: cloudmon
  labels:
    app.kubernetes.io/name: cloudmon-agent
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: cloudmon-agent
