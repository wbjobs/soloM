apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudmon-config
  namespace: cloudmon
data:
  CLOUDMON_AGGR_INTERVAL: "5"
  CLOUDMON_LOG_LEVEL: "info"
  CLOUDMON_SERVER_PORT: "8080"
  CLOUDMON_METRICS_ENABLED: "true"
  CLOUDMON_TOPO_REFRESH: "5"
  ANOMALY_SERVICE_URL: "http://cloudmon-anomaly:5000"
  ALERT_WEBHOOK_ENABLED: "false"
  ALERT_WEBHOOK_URL: ""
  ALERT_SILENCE_MINUTES: "5"
  ALERT_BATCH_INTERVAL: "5"
  ALERT_TRAINING_SAMPLES: "100"
