apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: cloudmon-agent
  namespace: cloudmon
  labels:
    app.kubernetes.io/name: cloudmon-agent
    app.kubernetes.io/component: ebpf-collector
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudmon-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloudmon-agent
        app.kubernetes.io/component: ebpf-collector
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: cloudmon-agent
      hostNetwork: true
      hostPID: true
      hostIPC: true
      tolerations:
        - operator: Exists
          effect: NoSchedule
        - operator: Exists
          effect: NoExecute
      nodeSelector:
        kubernetes.io/os: linux
      containers:
        - name: agent
          image: cloudmon/netwatch-agent:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            privileged: true
            capabilities:
              add:
                - SYS_ADMIN
                - NET_ADMIN
                - BPF
                - PERFMON
                - SYS_PTRACE
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
          envFrom:
            - configMapRef:
                name: cloudmon-config
          volumeMounts:
            - name: sys-kernel-debug
              mountPath: /sys/kernel/debug
            - name: sys-fs-bpf
              mountPath: /sys/fs/bpf
            - name: cgroup
              mountPath: /sys/fs/cgroup
              readOnly: true
            - name: lib-modules
              mountPath: /lib/modules
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          ports:
            - containerPort: 8080
              name: http
              hostPort: 8080
          livenessProbe:
            httpGet:
              path: /api/v1/services
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /api/v1/services
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: sys-kernel-debug
          hostPath:
            path: /sys/kernel/debug
            type: Directory
        - name: sys-fs-bpf
          hostPath:
            path: /sys/fs/bpf
            type: DirectoryOrCreate
        - name: cgroup
          hostPath:
            path: /sys/fs/cgroup
            type: Directory
        - name: lib-modules
          hostPath:
            path: /lib/modules
            type: Directory
