gateway:
  node_id: "gateway-01"
  host: "0.0.0.0"
  port: 8080
  advertise_addr: "gateway-01:8080"
  max_connections: 1000000
  ping_interval: 30
  pong_timeout: 60
  write_timeout: 10
  read_buffer_size: 1024
  write_buffer_size: 1024
  rate_limit:
    max_conn_per_sec: 1000
    burst: 5000
    max_pending: 10000
  batch_registry:
    batch_size: 500
    flush_interval_ms: 100

redis:
  addrs:
    - "127.0.0.1:6379"
  password: ""
  db: 0
  pool_size: 100
  min_idle_conns: 10
  channel: "push:channel"
  user_hash_key: "push:users"
  delay_queue_key: "push:delay_queue"
  history_key: "push:history"
  msg_data_key: "push:msg_data"

message:
  ack_timeout_sec: 30
  max_retry: 5
  history_ttl_hours: 168

api:
  host: "0.0.0.0"
  port: 9090

log:
  level: "info"
  format: "json"
